<div class="container-fluid InfoForm thin-scroll">
  <div class="header my-2 d-flex align-items-center justify-content-between p-1">
    <h6 class="m-0"><span class="headertxt"> {{extraAttributeObject.value.header}} Information : </span></h6>
    <button (click)="showEditMode()" class="previewbtn text-center btn float-right" *ngIf="canChange">
      <img src="../../../../../assets/shoppingCart/edit.png" class="imgIcon" />
      <span class="mx-1 text-white"> Edit</span>
    </button>
  </div>
  <hr class="" />
  <div class="pr-3">
    <div class="row p-3">
      <ng-container *ngFor="let attrMeta of appTransactionsForViewDto?.extraDataAttributes">
        <div class="col-md-6 mb-3"
          *ngIf="(extraAttributeObject.value.header.toUpperCase() === 'ADDITIONAL' && attrMeta.extraAttrUsage === 'ADDITIONAL') || 
                 (extraAttributeObject.value.header.toUpperCase() === 'RECOMMENDED' && attrMeta.extraAttrUsage === 'RECOMMENDED')">
          <div>
            <label class="font-weight-bold">{{ attrMeta.extraAttrName | localize }}</label>
          </div>
          <div class="mt-1">
            <ng-container *ngIf="attrMeta.selectedValues[attrMeta.selectedValues.length - 1]?.value">
              <span *ngIf="attrMeta.extraAttrDataType === 'Datetime'">
                {{ attrMeta.selectedValues[attrMeta.selectedValues.length - 1]?.value | date: 'dd MMMM yyyy' }}
              </span>
              <span *ngIf="attrMeta.extraAttrDataType !== 'Datetime'">
                {{ attrMeta.selectedValues[attrMeta.selectedValues.length - 1]?.value }}
              </span>
              
            </ng-container>
            <div *ngIf="!attrMeta.selectedValues[attrMeta.selectedValues.length - 1]?.value || attrMeta.selectedValues[attrMeta.selectedValues.length - 1]?.value ==''">
              -
            </div>
          </div>
        </div>
      </ng-container>
    </div>
  </div>
  <hr class="my-2" />
</div>
