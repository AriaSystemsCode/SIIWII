<div
  bsModal
  #selectBranchModal="bs-modal"
  class="modal fade"
  tabindex="-1"
  role="dialog"
  aria-hidden="true"
  [config]="{ backdrop: 'static' }"
>
  <div
    class="modal-dialog modal-lg side-modal"
    [ngClass]="isArabic ? 'left-modal' : 'right-modal'"
    role="document"
  >
        <div class="modal-content">

            <div class="modal-content-wrapper" *ngIf="active"  >
                <div class="modal-header mx-2">
                    <h4 class="modal-title" >
                        <span>{{l("SelectBranch")}}</span>
                        <p class="desc-menu-item">{{l("SelectFromTheBelowBranches")}}</p>
                    </h4>
                    <button style="position: absolute;top: 8px; width: 70px;" [ngStyle]="isArabic ? {'left':'0'} : {'right':'0'}" type="button" class="close" (click)="close()" aria-label="Close" [disabled]="saving">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body p-0 thin-scroll mr-2">
                    <p class="title-tree ml-3">{{l("ProductType")}}</p>
                    <p-tree [value]="filteredbranches" selectionMode="single" [filter]="true" [(selection)]="selectedBranch" (onNodeExpand)="getBranches($event)"  [loading]="loading">
                    </p-tree>

                </div>
                <div class="modal-footer">
                    <button [disabled]="saving" type="button" class="btn btn-default btn-gray" (click)="close()">{{l("Cancel")}}</button>
                    <button type="submit" (click)="selectBranch()" class="btn bgPurple" [disabled]="!selectedBranch" [buttonBusy]="saving" [busyText]="l('SavingWithThreeDot')"> <span>{{l("select")}}</span></button>
                </div>
            </div>
        </div>
    </div>
</div>
