<div class="modal-content-wrapper" *ngIf="active" [ngClass]="{'lookup-modal--arabic': isArabic}">
    <div class="modal-header">
        <h4 class="modal-title">
            <p class="desc-menu-item">{{l(entityObjectType.name)}} {{l("values")}} </p>
        </h4>
        <button type="button" class="close modal-close-btn" (click)="close()"
            aria-label="Close">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div class="modal-body p-0 thin-scroll" [ngClass]="isArabic ? 'ml-2 mr-0' : 'mr-2'">
        <div class="row lookup-toolbar">
            <div class="align-items-center border d-flex m-3 pb-2 pl-3 pt-2 rounded col-12 col-md-5 lookup-search">
                <span class="mr-3 lookup-search__icon">
                    <i class="fas fa-search"></i>
                </span>
                <input type="text" name="search" id="search" placeholder="{{ 'Search' | localize }}" (input)="onFilter()"
                    [(ngModel)]="searchQuery" class="form-control bg-white border-0 lookup-search__input">
            </div>

            <button *ngIf="showAddAction" title="{{ 'AddNewValue' | localize }}" type="button"
                class="btn btn-icon btn-primary col-12 col-md-5 mt-3 lookup-add-btn" (click)="openCreateOrEditModal()">
                <i class="flaticon2-plus lookup-add-btn__icon"> {{ 'AddNew' | localize }} {{l(entityObjectType.name)}}</i>
            </button>
        </div>
        <div class="d-flex flex-column mb-3" *ngIf="displayedRecords.length">
            <div class="align-items-center border-dashed-bottom d-flex justify-content-between p-3 lookup-record"
                *ngFor="let item of displayedRecords;index as i">
                <div class="d-flex align-items-center lookup-record__content" [ngClass]="{'t-checkbox-list':acceptMultiValues}">
                    <label class="pl-3 pt-3 pr-2" [ngClass]="acceptMultiValues ? 'kt-checkbox kt-checkbox--dark':'ml-3'"
                    [for]="!isNonLookupValue(item.code) ? item.value : item.code">
                    <p-checkbox *ngIf="acceptMultiValues" [value]="!isNonLookupValue(item.code) ? item.value : item.code" [id]="!isNonLookupValue(item.code) ? item.value : item.code"
                        [(ngModel)]="selectedRecords" [name]="entityObjectType.name"></p-checkbox>
                    <input type="radio" *ngIf="!acceptMultiValues" [value]="!isNonLookupValue(item.code) ? item.value : item.code" [id]="!isNonLookupValue(item.code) ? item.value : item.code"
                        [(ngModel)]="selectedRecords" [name]="entityObjectType.name" />
                </label>

                    <svg *ngIf="item?.hexaCode" class="lookup-record__swatch" viewBox="0 0 50 50" aria-hidden="true">
                        <rect width="50" height="50" rx="6" ry="6" [attr.fill]="item?.hexaCode"></rect>
                    </svg>
                    <img *ngIf="!item?.hexaCode && item?.image" class="lookup-record__image"
                        [src]="attachmentBaseUrl + '/' + item?.image" onerror="this.src='../../../../../assets/placeholders/appitem-placeholder.png'" />

                    <img *ngIf="!item?.hexaCode && !item?.image" class="lookup-record__image"
                        src="../../../../../assets/placeholders/appitem-placeholder.png" />

                  
                    <div class="d-flex flex-column pl-3 lookup-record__meta">
                        <span class="pt-1  font-weight-bold"> {{item.code}}</span>
                    <span class="pt-1"> {{item.label}}</span>
                </div>
                </div>
                <div class="row lookup-record__message" *ngIf="showActions && !item.isHostRecord && item.value">
                    *{{ 'AddedToLookup' | localize }}
                </div> 
               
                <div class="lookup-record__actions" *ngIf="showActions && !item.isHostRecord">
                    <div class="btn-group dropdown" dropdown container="body" [placement]="isArabic ? 'bottom left' : 'bottom right'">
                        <button class="dropdown-toggle btn btn-sm btn-action" dropdownToggle>
                        </button>
                        <ul id="dropdown-alignment" class="dropdown-menu dropdown-action-btn dropdown-menu-right"
                            *dropdownMenu>
                            <li>
                                <a (click)="openCreateOrEditModal(item)">{{'Edit' | localize}}</a>
                            </li>
                            <li>
                                <a (click)="deleteSycEntityObject(item,i)">{{'Delete' | localize}}</a>
                            </li>
                        </ul>
                    </div>
                </div>

            </div>
            <div *ngIf="displayedRecords?.length">
                <button class="btn btn-font-hover-brand" [ngClass]="isArabic ? 'mr-3 ml-0' : 'ml-3'" (click)="showMoreListData()"
                    *ngIf="showMoreListDataButton">
                    {{ 'showmore' | localize }} ...
                </button>
            </div>
            <div class="text-center" *ngIf="displayedRecords?.length === 0">
                {{ 'NoRecordsFound...' | localize }}
            </div>
        </div>
    </div>
    <div class="modal-footer">

        <button type="button" class="btn btn-default btn-gray modal-footer-btn modal-footer-btn--secondary" (click)="close()">{{l("Cancel")}}</button>
        <button type="button" class="btn btn-primary modal-footer-btn modal-footer-btn--primary" (click)="submitSelection()">
            {{l("Add")}}
        </button>
    </div>
</div>


<app-create-or-edit-app-entity-dynamic-modal #createOreEditAppEntityModal (cancel)="onCanceledHandler()"
    (saveDone)="onCreateOrEditDoneHandler()" [enableAddToLookup]="entityObjectType.name.toUpperCase()== 'COLOR'  || entityObjectType.name.toUpperCase()=='CLOSURE'" (addNonLookupValues)="onAddNonLookupValues($event)">
</app-create-or-edit-app-entity-dynamic-modal>
