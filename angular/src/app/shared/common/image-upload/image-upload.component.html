<div class="d-flex justify-content-center image-upload-container">
  <label
    class="p-0 mb-0 w-100 h-100 inputBorder"
    for="image{{ inputID }}"
    [ngClass]="fromReview ? '' : 'uploadfilecontainer'"
    (drop)="fileChange($event)"
  >
    <input
      class="input-file"
      type="file"
      name="image{{ inputID }}"
      id="image{{ inputID }}"
      (change)="fileChange($event)"
      [accept]="acceptedExtensions"
      [disabled]="isDisabled"
      [ngClass]="{ 'input-file--disabled': isDisabled }"
    />

    <!-- Image preview -->
    <app-image-display
      *ngIf="image && !isPdf && !isExcel"
      [staticWidth]="staticWidth"
      [staticHeight]="staticHeight"
      [image]="image"
      [sycAttachmentCategory]="sycAttachmentCategory"
    >
    </app-image-display>

    <!-- PDF preview -->
    <ng-container *ngIf="isPdf && pdfObjectUrl">
      <div class="align-items-center d-flex flex-column h-100 justify-content-center w-100">
        <img
          src="assets/placeholders/pdf-placeholder.png"
          class="pdf-thumb mb-2"
          alt="{{ 'PDF' | localize }}"
          (click)="onPdfThumbClick($event)"
        />
        <span class="text-primary">{{ 'OpenPDF' | localize }}</span>
      </div>
    </ng-container>

    <!-- Excel preview -->
    <ng-container *ngIf="isExcel">
      <div class="d-flex flex-column align-items-center justify-content-center h-100 w-100 p-3">
        <i class="fas fa-file-excel text-success mb-2" style="font-size: 42px;"></i>

        <span class="text-truncate text-center w-100" [title]="excelFileName">
          {{ excelFileName }}
        </span>

        <button type="button" class="btn btn-link btn-sm mt-2" (click)="downloadExcel($event)">
          {{ 'Download' | localize }}
        </button>
      </div>
    </ng-container>

    <!-- Empty state -->
    <div
      *ngIf="!hasContent"
      class="align-items-center d-flex flex-column h-100 justify-content-center w-100 pl-1 pr-1"
    >
      <div *ngIf="!fromReview">{{ l('ClickOrDrop') }}</div>
      <div *ngIf="sycAttachmentCategory?.aspectRatio && showGuidelines">
        {{ aspectRatioLabel }}
      </div>
      <div *ngIf="sycAttachmentCategory?.maxFileSize && showGuidelines">
        {{ l('MaxSize?', sycAttachmentCategory?.maxFileSize) }} MB
      </div>
      <div *ngIf="sycAttachmentCategory?.message && showGuidelines">
        {{ l(sycAttachmentCategory?.message) }}
      </div>
      <div *ngIf="acceptedExtensions && showGuidelines">
        {{ l('SupportedExtensions') }} {{ acceptedExtensions }}
      </div>
    </div>

    <img *ngIf="!fromReview" src="assets/profile/Edit_Image.svg" class="image-upload-edit" />
    <img
      *ngIf="fromReview"
      src="assets/placeholders/imageAttach.png"
      class="mr-2 iconImg"
      alt="{{ 'ImageAttach' | localize }}"
    />
    <img
      src="assets/profile/Remove_image.svg"
      *ngIf="hasContent"
      class="image-upload-remove"
      (click)="emitRemoveImage($event)"
    />
  </label>
</div>
