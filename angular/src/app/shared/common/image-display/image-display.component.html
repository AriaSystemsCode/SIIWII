<img
  *ngIf="image"
  [ngClass]="classList"
  class="img-thumbnail p-0"
  [ngStyle]="{
    width: staticWidth ? staticWidth + 'px' : '100%',
    height: staticHeight ? staticHeight + 'px' : 'auto',
    'border-radius': staticeRadius ? staticeRadius + 'px' : null
  }"
  [src]="image"
  [alt]="alt"
  onerror="this.src='../../../../../assets/placeholders/appitem-placeholder.png'"
/>
