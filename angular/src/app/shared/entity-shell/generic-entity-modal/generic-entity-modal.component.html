<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [appendTo]="'body'"
  [draggable]="false"
  [resizable]="false"
  [closable]="false"
  [showHeader]="false"

  [style]="{
    width: maximized ? '100vw' : width,
    height: maximized ? '100vh' : height,
    'overflow-x': 'hidden',
    padding: '0'
  }"

  [contentStyle]="{
    padding: '0',
    height: '100%',
    'overflow-x': 'hidden'
  }"

  styleClass="generic-entity-modal generic-entity-position"

  (onHide)="onDialogHide()"
>
  <ng-content></ng-content>
</p-dialog>
