<div class="entity-basic-info p-4">

  <div class="d-flex flex-wrap justify-content-between">

    <div class="field" *ngFor="let field of fields">

      <label>{{ field.label }}:</label>

      <input
        *ngIf="field.type === 'text'"
        class="form-control"
        [ngModel]="getValue(field.valuePath)"
        (ngModelChange)="setValue(field.valuePath, $event)"
        [readonly]="mode === 'view' || field.readonly" />

      <p-dropdown
        *ngIf="field.type === 'dropdown'"
        [options]="field.options"
        [optionLabel]="field.optionLabel || 'label'"
        [optionValue]="field.optionValue || 'value'"
        [ngModel]="getValue(field.valuePath)"
        (ngModelChange)="setValue(field.valuePath, $event)"
        [disabled]="mode === 'view' || field.readonly">
      </p-dropdown>

    </div>

  </div>

</div>
