<div class="entity-header">

  <div class="header-left">
    <app-entity-breadcrumb
      [items]="breadcrumbItems">
    </app-entity-breadcrumb>
  </div>

  <div class="header-title">
    {{ title }}
  </div>

  <div class="header-actions">


    <button class="window-btn" (click)="minimize.emit()">—</button>
    <!-- <button class="window-btn" (click)="maximize.emit()">□</button> -->
    <button class="window-btn" (click)="close.emit()">×</button>

  </div>

</div>
