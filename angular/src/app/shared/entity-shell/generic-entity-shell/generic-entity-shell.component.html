<div class="shell-container" [class.compact-shell]="isCompactScreen">

  <!-- BACKDROP (mobile) -->
  <div *ngIf="isMobileLeftOpen" class="mobile-left-backdrop" (click)="closeLeftPanel()"></div>

  <!-- LEFT PANEL -->
  <div
    class="left-panel-container"
    [class.collapsed]="leftPanelCollapsed"
    [class.compact-left-panel]="isCompactScreen"
    [class.open]="isMobileLeftOpen">

    <div *ngIf="isCompactScreen" class="compact-left-header">
      <span class="compact-left-title">Entity level</span>
      <button type="button" class="compact-left-close" (click)="closeLeftPanel()">
        <i class="fa fa-angle-double-left"></i>
      </button>
    </div>

    <app-entity-left-side-panel
      [sections]="leftPanelSections"
      [collapsed]="isCompactScreen ? false : leftPanelCollapsed"
      (toggle)="toggleLeftPanel()"
      (itemSelect)="selectNode($event)"
      (add)="onAdd($event)">
    </app-entity-left-side-panel>
  </div>

  <!-- RIGHT SHELL -->
  <div class="right-shell-container">

    <app-entity-header
      [title]="currentTitle"
      [breadcrumbItems]="currentBreadcrumbItems"
      [mode]="displayedMode"
      (breadcrumbItemClick)="onBreadcrumbClick($event)"
      (close)="close.emit()"
      (minimize)="minimize.emit()">
    </app-entity-header>

    <div class="shell-body">

      <!-- MOBILE: open left panel -->
      <button
        *ngIf="isCompactScreen && leftPanelCollapsed && mobileSection === 'main'"
        type="button"
        class="mobile-left-trigger"
        title="Browse"
        (click)="openLeftPanel()">
        <i class="fa fa-sitemap"></i>
      </button>

      <!-- MOBILE: right icon rail -->
      <div *ngIf="isCompactScreen" class="mobile-right-rail">
        <button type="button" class="mobile-rail-btn" title="Details"
          [class.active]="mobileSection === 'main'" (click)="showMain()">
          <i class="fa fa-info-circle"></i>
        </button>

        <button type="button" class="mobile-rail-btn" title="Related"
          [class.active]="mobileSection === 'right'" (click)="showRelated()">
          <i class="fa fa-list-alt"></i>
        </button>

        <button type="button" class="mobile-rail-btn" title="Notes"
          [class.active]="mobileSection === 'notes'" (click)="showNotes()">
          <i class="fa fa-sticky-note"></i>
        </button>
      </div>

      <!-- DETAILS -->
      <div class="main-section" [hidden]="isCompactScreen && mobileSection !== 'main'">

        <app-entity-basic-info
          [entity]="displayedEntity"
          [entityData]="displayedEntityData"
          [mode]="displayedMode"
          [canDetele]="canDetele"
          [entityTypes]="entityTypes"
          [statuses]="statuses"
          [fields]="displayedBasicInfoFields"
          [showMedia]="displayedShowMedia"
          [logoPath]="logoPath"
          [coverPath]="coverPath"
          [imagesPath]="imagesPath"
          [attachmentsPath]="attachmentsPath"
          [logoAttachmentCategory]="logoAttachmentCategory"
          [bannerAttachmentCategory]="bannerAttachmentCategory"
          [imageAttachmentCategory]="imageAttachmentCategory"
          [showAdditionalImages]="displayedShowAdditionalImages"
          [saving]="displayedSaving"
          [uploading]="dynamicEntityActive ? false : uploading"
          (entityChange)="onEntityChange($event)"
          (logoChange)="onLogoChange($event)"
          (backgroundChange)="onBackgroundChange($event)"
          (imageChange)="onImageChange($event)"
          (attachmentRemove)="onAttachmentRemove($event)"
          (delete)="onDelete()"
          (edit)="onEdit()"
          (save)="onSave()"
          (cancel)="onCancel()">
        </app-entity-basic-info>

        <div class="content-row m-3">

          <div class="main-content-container" [class.expanded]="rightPanelCollapsed">

            <!-- Root entity content (projected by parent) -->
            <div class="root-entity-content" [hidden]="dynamicEntityActive">
              <ng-content select="[entity-main-content]"></ng-content>
            </div>

            <div *ngIf="dynamicEntityActive && displayedLoading" class="text-center py-5">
              <i class="fa fa-spinner fa-spin"></i>
            </div>

            <!-- Dynamic entity (branch, contact, ...) -->
            <div class="dynamic-entity-content" [hidden]="!dynamicEntityActive">
              <ng-template #entityComponentHost></ng-template>
            </div>
          </div>

          <!-- DESKTOP RIGHT PANEL -->
          <div
            *ngIf="!isCompactScreen"
            class="right-panel-wrapper"
            [class.collapsed]="rightPanelCollapsed">

            <button type="button" class="panel-toggle-btn" (click)="toggleRightPanel()">
              <i class="fa" [ngClass]="rightPanelCollapsed ? 'fa-chevron-left' : 'fa-chevron-right'"></i>
            </button>

            <ng-container *ngIf="!rightPanelCollapsed">
              <app-entity-right-panel
                [entityData]="displayedEntityData"
                [entityId]="displayedEntityId"
                [creatorUserId]="displayedEntity?.creatorUserId"
                [parentId]="displayedEntity?.parentId">
              </app-entity-right-panel>

              <div class="mt-3">
                <app-notes [entityId]="displayedEntityId"></app-notes>
              </div>
            </ng-container>
          </div>
        </div>
      </div>

      <!-- MOBILE RELATED -->
      <div *ngIf="isCompactScreen && mobileSection === 'right'" class="compact-panel-content">
        <app-entity-right-panel
          [entityData]="displayedEntityData"
          [entityId]="displayedEntityId"
          [creatorUserId]="displayedEntity?.creatorUserId"
          [parentId]="displayedEntity?.parentId">
        </app-entity-right-panel>
      </div>

      <!-- MOBILE NOTES -->
      <div *ngIf="isCompactScreen && mobileSection === 'notes'" class="compact-panel-content">
        <app-notes [entityId]="displayedEntityId"></app-notes>
      </div>

    </div>
  </div>
</div>
