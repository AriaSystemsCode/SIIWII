<div class="shell-container">

  <div
  class="left-panel-container"
  [class.collapsed]="leftPanelCollapsed">

  <app-entity-left-side-panel
    [sections]="leftPanelSections"
    [collapsed]="leftPanelCollapsed"
    (toggle)="leftPanelCollapsed = !leftPanelCollapsed">
  </app-entity-left-side-panel>

</div>

  <div class="right-shell-container">

    <app-entity-header
      [title]="title"
      [breadcrumbItems]="breadcrumbItems"
      [mode]="mode"
      (close)="close.emit()"
      (minimize)="minimize.emit()"
      (maximize)="maximize.emit()">
    </app-entity-header>

    <app-entity-basic-info
      [entity]="entity"
      [entityData]="entityData"
      [mode]="mode"
      [entityTypes]="entityTypes"
      [statuses]="statuses"
       [fields]="basicInfoFields"
      (entityChange)="entityChange.emit($event)">
    </app-entity-basic-info>

    <div class="content-row row m-3">

      <div class="main-content-container col-md-7">
        <ng-content select="[entity-main-content]"></ng-content>
      </div>

      <div class="right-panel-container col-md-5">
        <app-entity-right-panel></app-entity-right-panel>
      </div>

    </div>

  </div>

</div>
