<div class="entity-right-panel">

  <div class="panel-tabs">

    <button
      class="tab-btn"
      [class.active]="activeTab === 'audit'"
      (click)="activeTab = 'audit'">
      Audit trail
    </button>

    <button
      class="tab-btn"
      [class.active]="activeTab === 'messages'"
      (click)="activeTab = 'messages'">
      Message
    </button>

    <button
      class="tab-btn"
      [class.active]="activeTab === 'related'"
      (click)="activeTab = 'related'">
      Relations
    </button>

  </div>

  <div class="tab-indicator">
    <div
      class="active-line"
      [ngClass]="{
        'audit': activeTab === 'audit',
        'messages': activeTab === 'messages',
        'related': activeTab === 'related'
      }">
    </div>
  </div>

  <div class="panel-content">

    <app-audit-trail *ngIf="activeTab === 'audit'"></app-audit-trail>

    <app-entity-messages *ngIf="activeTab === 'messages'"></app-entity-messages>

    <app-related-entities *ngIf="activeTab === 'related'"></app-related-entities>

  </div>

</div>
