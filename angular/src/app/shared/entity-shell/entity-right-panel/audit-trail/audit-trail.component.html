<div class="audit-trail-panel">

  <div
    *ngIf="loading"
    class="audit-loading">

    Loading...

  </div>


  <div
    *ngIf="
      !loading &&
      (!items || items.length === 0)
    "
    class="audit-empty">

    No audit trail found.

  </div>


  <div
    *ngFor="
      let item of items;
      let last = last
    "
    class="audit-item"
    [class.last]="last">

    <span class="audit-dot"></span>


    <div class="audit-content d-flex justify-content-between align-items-center">

      <div class="audit-text d-flex">

        <div class="audit-title">
          {{ item.userName }}
          {{ item.action }}
            {{ item.entityName }}
        </div>



      </div>


      <div class="audit-date">
        {{ item.date | date:'MMM d \'at\' h:mm a' }}
      </div>

    </div>

  </div>


  <button
    *ngIf="
      hasMore &&
      !loading
    "
    type="button"
    class="show-more-btn d-flex justify-content-between align-items-center w-100"
   >

    <p>
      Show more
    </p>

    <i class="fa fa-chevron-right"></i>

  </button>

</div>
