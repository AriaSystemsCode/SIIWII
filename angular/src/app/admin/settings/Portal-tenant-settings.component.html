<div class="dashboard-page">

    <tabset
        #dashboardTabs
        [justified]="true"
        [ngClass]="{
            'nav-hidden':
                !moreThanOnePage()
        }">


        <tab
            *ngFor="
                let page of
                (userDashboard?.pages || []);

                let i = index
            "
            [heading]="page.name"
            (selectTab)="
                selectPageTab(
                    page.id
                )
            ">


            <!-- ====================================== -->
            <!-- GRIDSTER -->
            <!-- ====================================== -->

            <gridster

                class="dashboard-grid"

                [options]="options[i]"

                [ngClass]="{
                    'no-tab':
                        !moreThanOnePage()
                }">


                <!-- ================================= -->
                <!-- WIDGET -->
                <!-- ================================= -->

                <gridster-item

                    *ngFor="
                        let widget of
                        page.widgets
                    "

                    [item]="
                        widget.gridInformation
                    ">


                    <div
                        class="dashboard-widget">


                        <!-- ========================= -->
                        <!-- HEADER -->
                        <!-- ========================= -->

                        <div
                            class="
                                dashboard-widget-header
                                dashboard-widget-drag-handle
                            ">


                            <div
                                class="
                                    dashboard-widget-title
                                ">

                                {{ widget.name }}

                            </div>


                            <div
                                class="
                                    dashboard-widget-actions
                                ">


                                <span
                                    class="
                                        dashboard-widget-type
                                    ">

                                    {{
                                        widget.chart?.type
                                    }}

                                </span>


                                <button

                                    type="button"

                                    class="
                                        dashboard-widget-remove
                                    "

                                    title="Remove"

                                    (mousedown)="
                                        $event.stopPropagation()
                                    "

                                    (click)="
                                        $event.stopPropagation();
                                        removeWidget(
                                            page,
                                            widget
                                        )
                                    ">

                                    <i
                                        class="
                                            fa
                                            fa-times
                                        ">
                                    </i>

                                </button>

                            </div>

                        </div>


                        <!-- ========================= -->
                        <!-- CHART BODY -->
                        <!-- ========================= -->

                        <div
                            class="
                                dashboard-widget-body
                            ">


                          <ejs-pivotview
    *ngIf="widget.widgetType === 'PivotChart'"

    [id]="'pivotDashboardChart_' + widget.id"

    width="100%"
    height="320"

    [dataSourceSettings]="widget.dataSourceSettings"

    [displayOption]="pivotChartOnlyDisplay"

    [chartSettings]="widget.chartSettings"

    [showGroupingBar]="false"

    [showFieldList]="false"

    (created)="onPivotChartCreated(widget.id)">

</ejs-pivotview>

                        </div>

                    </div>

                </gridster-item>

            </gridster>

        </tab>

    </tabset>

</div>
