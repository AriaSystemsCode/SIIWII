<div [@routerTransition]>
	<div class="kt-content  kt-grid__item kt-grid__item--fluid kt-grid kt-grid--hor">


		<div class="kt-subheader kt-grid__item">
			<div [class]="containerClass">
				<div class="kt-subheader__main">
					<h3 class="kt-subheader__title">
						<span *ngIf="active && appTenantInvoice.id">{{"EditAppTenantInvoice" }}</span>
						<span *ngIf="active && !appTenantInvoice.id">{{l("CreateAppTenantInvoice")}}</span>
					</h3>
					<span class="kt-subheader__separator kt-subheader__separator--v"></span>
					<div class="kt-subheader__breadcrumbs">
						<a [routerLink]="['/app/admin/appSubscriptionPlans/appTenantInvoices']"
							class="kt-subheader__breadcrumbs-home"><i
								class="flaticon2-shelter"></i>{{l("AppTenantInvoice")}}</a>
						<span class="kt-subheader__breadcrumbs-separator"></span>
						<a class="kt-subheader__breadcrumbs-link kt-subheader__breadcrumbs-link--active">
							<span *ngIf="active && appTenantInvoice.id">{{l("Edit")}}</span>
							<span *ngIf="active && !appTenantInvoice.id">{{l("Create")}}</span>
						</a>
					</div>
				</div>
			</div>
		</div>


		<div [class]="containerClass + ' kt-grid__item kt-grid__item--fluid'">
			<div class="kt-portlet kt-portlet--mobile">
				<div class="kt-portlet__body">

					<div class="form-group">
						<label for="AppTenantInvoice_TenantId">{{l("TenantName")}}</label>
						<p-dropdown [options]="TenantList" optionLabel="name" placeholder="Select Tenant"
							(onChange)="onChange($event)" optionLabel="name" optionValue="id"
							[(ngModel)]="appTenantInvoice.tenantId" name="tenantSelection">
						</p-dropdown>

					</div>
					<div class="form-group">
						<label for="AppTenantInvoice_InvoiceNumber">{{l("InvoiceNumber")}} *</label>
						<input type="text" #AppTenantInvoice_InvoiceNumber="ngModel" id="AppTenantInvoice_InvoiceNumber"
							class="form-control" [(ngModel)]="appTenantInvoice.invoiceNumber" name="InvoiceNumber"
							minlength="0" maxlength="12" required />
						<validation-messages [formCtrl]="AppTenantInvoice_InvoiceNumber"></validation-messages>
					</div>

					<div class="form-group">
						<label for="AppTenantInvoice_InvoiceDate">{{l("InvoiceDate")}}</label>
						<input required class="form-control m-input" #AppTenantInvoice_InvoiceDate type="datetime"
							bsDatepicker datePickerMomentModifier [(date)]="appTenantInvoice.invoiceDate"
							id="AppTenantInvoice_InvoiceDate" name="AppTenantInvoice_InvoiceDate">
						<validation-messages [formCtrl]="AppTenantInvoice_InvoiceDate"></validation-messages>
					</div>

					<div class="form-group">
						<label for="AppTenantInvoice_Amount">{{l("Amount")}}</label>
						<input type="number" #AppTenantInvoice_Amount="ngModel" id="AppTenantInvoice_Amount"
							class="form-control" [(ngModel)]="appTenantInvoice.amount" name="Amount" />
						<validation-messages [formCtrl]="AppTenantInvoice_Amount"></validation-messages>
					</div>

					<div class="form-group">
						<label for="AppTenantInvoice_DueDate">{{l("DueDate")}}</label>
						<input required class="form-control m-input" #AppTenantInvoice_DueDate type="datetime"
							bsDatepicker datePickerMomentModifier [(date)]="appTenantInvoice.dueDate"
							id="AppTenantInvoice_DueDate" name="AppTenantInvoice_DueDate">
						<validation-messages [formCtrl]="AppTenantInvoice_DueDate"></validation-messages>
					</div>

					<div class="form-group">
						<label for="AppTenantInvoice_PayDate">{{l("PayDate")}}</label>
						<input required class="form-control m-input" #AppTenantInvoice_PayDate type="datetime"
							bsDatepicker datePickerMomentModifier [(date)]="appTenantInvoice.payDate"
							id="AppTenantInvoice_PayDate" name="AppTenantInvoice_PayDate">
						<validation-messages [formCtrl]="AppTenantInvoice_PayDate"></validation-messages>
					</div>

				</div>
				<!--start-->
				<div class="col-12 item-photos-body pt-4 pb-5 ml-5 pl-5">
					<div class="row pt-3 pb-3 pl-3">
						<div  class="image-wrapper mb-5"
						style="border: 1px solid #4A0D4A; border-radius: 12px !important;"
						[ngClass]="{'upload': !attachment, 'drag-over': draggingIndex === i}"
						*ngFor="let attachment of attachmentsSrcs; index as i"
						(dragover)="onDragOver($event, i)"
						(dragleave)="onDragLeave($event)"
						(drop)="onFileDrop($event, imageCategory, i)">
							<label *ngIf="!attachment"
								class="d-flex flex-column justify-content-center h-100 align-items-center"
								for="file_{{i}}">
								<div class="align-items-end d-flex justify-content-center upload-image-icons mt-3">

									<div class="middle-icon">
										<i class="fas "> <img src="../../../assets/placeholders/cloud-add.png" /> </i>
									</div>
								</div>
								<div class="text-center">
									<p style="font-weight: bold; color: black;
white-space: nowrap;">
										Choose a file or drag & drop it here
									<p>

									<p>
										{{ 'File can be PDf format, up to 25 MB' | localize}}.
									</p>

									<a class="btn btn-primary btn-sm mb-3 upload-btn"
										style="color: white !important; background-color: #4A0D4A !important;">
										{{ 'Browse File' | localize}}
									</a>
								</div>
							</label>
							<a *ngIf="attachment"
							class="d-flex flex-column justify-content-center h-100 align-items-center kt-avatar">
						   
						   <div class="d-flex flex-column justify-content-center h-100 w-100 position-absolute view-img-overlay">
							 <div class="text-center mb-3">
							   <i class="fa-photo-video fas bg-transparent text-white fa-3x"></i>
							 </div>
							 <div class="text-center">
							   <button type="button" class="btn btn-dark text-white border-lg border-white"
									   (click)="openImageViewer(attachment)">
								 {{ 'ImagePreview' | localize }}
							   </button>
							 </div>
							 <div class="bg-white kt-avatar__upload">
							   <img class="mr-2" src="../../../../../assets/Items/Frame 1707478667.png" />
							 </div>
						   </div>
						 
						   <!-- ✅ Show image preview if it's an image -->
						   <img *ngIf="isImage(attachment)" [src]="attachment" />
						 
						   <!-- ✅ Show PDF thumbnail if it's not an image -->
						   <ng-container *ngIf="!isImage(attachment)">
							 <img src="assets/placeholders/pdf-icon.png" width="48" />
							 <div class="text-dark mt-2">PDF</div>
						   </ng-container>
						 
						   <a class="select-default-image p-2" style="border: 1px solid #EEEEEE !important; border-radius: 12px;">
							 <i class="fa fa-check-square mr-2"> </i>
						   </a>
						 </a>
						 
							<input type="file" id="file_{{i}}" class="d-none" #file
								(change)="fileChange($event,imageCategory,i,undefined,true)" style="background-color: #EEEEEE !important;
							border: none !important">
						</div>

					</div>
					<!--End-->

					<div class="kt-portlet__foot">
						<div class="col-lg-12">
							<button (click)="save()" class="btn btn-primary blue float-right" [buttonBusy]="saving"
								[busyText]="l('SavingWithThreeDot')"><i class="fa fa-save"></i>
								<span>{{l("Save")}}</span>
							</button>
						
						</div>
					</div>
				</div>
			</div>
		</div>

	</div>
