<div [@routerTransition] class="wrapper">
    <div class="kt-content kt-grid__item kt-grid__item--fluid kt-grid kt-grid--hor pb-0">

        <div class="kt-subheader kt-grid__item" *ngIf="active">
            <div [class]="containerClass">
                <div class="kt-subheader__main">
                    <h6 class="kt-subheader__title">
                        <span>{{ isManualOrExternalContact ? l("ManualContact") : l("TeamMember") }}</span>
                    </h6>
                    <span class="kt-subheader__separator kt-subheader__separator--v"></span>
                    <h6 class="mb-0 mr-2">{{ memberDto?.name }}</h6>
                    <span class="hint">{{ "ProfileInformation" | localize }}</span>
                </div>
                <div class="kt-subheader__toolbar">
                    <div class="kt-subheader__wrapper">
                        <button type="submit" class="btn btn-save btn-1bc5bd w-auto ml-4" (click)="SaveMember()"
                            [disabled]="!memberForm.form.valid">
                            <span>{{ l("SaveChanges") }}</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div [class]="containerClass + ' kt-grid__item kt-grid__item--fluid'">
            <div class="kt-portlet kt-portlet--mobile">
                <div class="kt-portlet__body pt-5">
                    <form #memberForm="ngForm">
                        <div *ngIf="active">

                            <!-- Profile picture -->
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label col-form-label-sm label-form">
                                    <span class="text-danger">*</span> {{ l("MyPhoto") }}
                                </label>
                                <app-image-upload
                                    [sycAttachmentCategory]="sycAttachmentCategoryLogo"
                                    [image]="ProfileImg"
                                    [staticHeight]="170"
                                    [showGuidelines]="true"
                                    (imageBrowseDone)="imageBrowseDone($event, sycAttachmentCategoryLogo)"
                                    (removeImage)="removeImage(sycAttachmentCategoryLogo)">
                                </app-image-upload>
                            </div>

                            <!-- Cover photo -->
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label col-form-label-sm label-form">{{ l("CoverPhoto") }}</label>
                                <app-image-upload
                                    [sycAttachmentCategory]="sycAttachmentCategoryBanner"
                                    [image]="coverPhoto"
                                    [staticHeight]="120"
                                    [showGuidelines]="true"
                                    (imageBrowseDone)="imageBrowseDone($event, sycAttachmentCategoryBanner)"
                                    (removeImage)="removeImage(sycAttachmentCategoryBanner)">
                                </app-image-upload>
                            </div>

                            <!-- First name -->
                            <div class="row">
                                <label for="FirstName" class="col-sm-2 col-form-label col-form-label-sm label-form">
                                    <span class="text-danger">*</span> {{ l("First Name") }}
                                </label>
                                <div class="col-md-8">
                                    <input type="text" id="FirstName" class="form-control" name="FirstName"
                                        #FirstNameInput="ngModel" [ngModel]="getStringValue(701)"
                                        (ngModelChange)="setStringValue(701, $event)" required
                                        [placeholder]="'PleaseEnterFirstName' | localize" />
                                    <validation-messages [formCtrl]="FirstNameInput"></validation-messages>
                                </div>
                            </div>
                            <hr class="header">

                            <!-- Sur name -->
                            <div class="row">
                                <label for="LastName" class="col-sm-2 col-form-label col-form-label-sm label-form">
                                    <span class="text-danger">*</span> {{ l("Sir Name") }}
                                </label>
                                <div class="col-md-8">
                                    <input type="text" id="LastName" class="form-control" name="LastName"
                                        #LastNameInput="ngModel" [ngModel]="getStringValue(702)"
                                        (ngModelChange)="setStringValue(702, $event)" required
                                        [placeholder]="'PleaseEnterLastName' | localize" />
                                    <validation-messages [formCtrl]="LastNameInput"></validation-messages>
                                </div>
                            </div>
                            <hr class="header">

                            <!-- Code -->
                            <div class="row">
                                <label for="code" class="col-sm-2 col-form-label col-form-label-sm label-form">
                                    <span class="text-danger">*</span> {{ l("Code") }}
                                </label>
                                <div class="col-md-8">
                                    <input type="text" id="code" class="form-control" name="code" #CodeInput="ngModel"
                                        [(ngModel)]="memberDto.code" required
                                        [placeholder]="'PleaseEnterCode' | localize" [disabled]="memberDto?.id" />
                                    <validation-messages [formCtrl]="CodeInput"></validation-messages>
                                </div>
                            </div>
                            <hr class="header">

                            <!-- Email -->
                            <div class="row">
                                <label for="Email" class="col-sm-2 col-form-label col-form-label-sm label-form">
                                    <span class="text-danger">*</span> {{ l("Email") }}
                                </label>
                                <div class="col-md-6">
                                    <input type="email" id="Email" class="form-control" name="Email"
                                        #emailAddressInput="ngModel" [(ngModel)]="memberDto.eMailAddress" required
                                        [placeholder]="'PleaseEnterEmail' | localize" />
                                    <validation-messages [formCtrl]="emailAddressInput"></validation-messages>
                                </div>
                                <div class="col-md-4" *ngIf="!isManualOrExternalContact">
                                    <span class="mr-3 isPublic">{{ "IsPublic" | localize }}</span>
                                    <p-inputSwitch [ngModel]="getBooleanValue(709)"
                                        (onChange)="setBooleanValue(709, $event.checked)"
                                        name="EmailAddressIsPublic"></p-inputSwitch>
                                </div>
                            </div>
                            <hr class="header">

                            <!-- Language -->
                            <div class="row">
                                <label for="language" class="col-sm-2 col-form-label col-form-label-sm label-form">
                                    {{ l("Language") }}
                                </label>
                                <div class="col-md-6">
                                    <p-dropdown id="language" [options]="allLanguages" styleClass="form-control aria-select"
                                        name="Language" [(ngModel)]="memberDto.languageId"></p-dropdown>
                                </div>
                                <div class="col-md-4" *ngIf="!isManualOrExternalContact">
                                    <span class="mr-3 isPublic">{{ "IsPublic" | localize }}</span>
                                    <p-inputSwitch [ngModel]="getBooleanValue(708)"
                                        (onChange)="setBooleanValue(708, $event.checked)"
                                        name="languageIsPublic"></p-inputSwitch>
                                </div>
                            </div>
                            <hr class="header">

                            <!-- Phones -->
                            <div class="form-group row" *ngFor="let item of phonelist; let i = index">
                                <label class="col-sm-2 col-form-label col-form-label-sm label-form">{{ l("Phone") }}</label>
                                <div class="col-sm-3" *ngIf="phonesLoaded">
                                    <p-dropdown id="phone" name="phone{{i+1}}TypeId" [options]="allPhoneTypes"
                                        [(ngModel)]="memberDto['phone'+(i+1)+'TypeId']"
                                        (onChange)="onPhoneTypeChange($event, i)"></p-dropdown>
                                </div>
                                <div class="col-sm-3">
                                    <input type="text" ng2TelInput [ng2TelInputOptions]="{initialCountry: 'us'}"
                                        name="phone{{i+1}}Number"
                                        (countryChange)="onCountryChangephoneNumber($event, i)"
                                        (intlTelInputObject)="telInputObjectphoneNumber($event, i)"
                                        class="form-control form-control-sm aria-input-text phone-input"
                                        [(ngModel)]="memberDto['phone'+(i+1)+'Number']" />
                                </div>
                                <div class="col-sm-2">
                                    <input type="text" class="form-control" name="phone{{i+1}}Ex" minlength="1"
                                        maxlength="10" [placeholder]="'Ext.' | localize"
                                        [(ngModel)]="memberDto['phone'+(i+1)+'Ex']" />
                                </div>
                                <div class="col-sm-2 d-flex align-items-center" *ngIf="!isManualOrExternalContact">
                                    <span class="mr-2 isPublic">{{ "IsPublic" | localize }}</span>
                                    <p-inputSwitch [ngModel]="getBooleanValue(710 + i)"
                                        (onChange)="setBooleanValue(710 + i, $event.checked)"
                                        name="Phone{{i}}IsPublic"></p-inputSwitch>
                                </div>
                                <div class="col-sm-1">
                                    <i type="button" *ngIf="phonelist.length < 3 && i == 0" class="fas fa-plus-circle"
                                        (click)="AddPhoneToList()"></i>
                                    <i type="button" *ngIf="i > 0" class="fas fa-minus-circle"
                                        (click)="removePhoneFromList(i)"></i>
                                </div>
                            </div>
                            <hr class="header">

                            <!-- About -->
                            <div class="form-group row">
                                <label for="About" class="col-sm-2 col-form-label col-form-label-sm label-form">{{ l("About") }}</label>
                                <div class="col-md-8">
                                    <textarea class="form-control z-depth-1 aria-textarea-text" id="About" rows="4"
                                        name="About" [placeholder]="'PleaseEnterAboutMember' | localize"
                                        [(ngModel)]="memberDto.notes"></textarea>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Relationship Settings: Job title / Join date / Branch -->
            <div class="relation-settings-section mt-4" *ngIf="active">
             
                <h5 class="font-weight-bold mb-3">{{ 'RelationshipSettings' | localize }}</h5>

                <app-dynamicInputs *ngIf="relationAttributeObject && relationEntityObjectTypeId"
                    [extraAttributeObject]="relationAttributeObject"
                    [entityObjectTypeId]="relationEntityObjectTypeId"
                    [entityType]="'MARKETPLACECONTACTRELATIONSHIP'"
                    [dynamicInputsForViewDto]="relationInputsDto"
                    [fromSetting]="true"
                    (extraDataChanged)="onRelationSettingsChanged($event)"
                    (extraDataCleared)="onRelationSettingCleared($event)">
                </app-dynamicInputs>
            </div>
        </div>
    </div>
</div>
