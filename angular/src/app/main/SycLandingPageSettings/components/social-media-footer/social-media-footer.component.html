<div class="footer-bottom-wrapper pt-5">

    <a *ngFor="let s of links; "
       [href]="s.url" target="_blank" rel="noopener"
       class="generic-anchor pr-5 ">
      <ng-container [ngSwitch]="s.name.toLowerCase()">
        <div *ngSwitchCase="'youtube'" class="d-inline-block pl-1" style="background-color:#fff;width:40px;height:35px;border-radius:5px;">
          <img [src]="s.image" style="width:34px;height:34px" alt="{{s.name}}"/>
        </div>
        <img *ngSwitchDefault [src]="s.iconSrc" alt="{{s.name}}"/>
      </ng-container>
    </a>
  </div>
