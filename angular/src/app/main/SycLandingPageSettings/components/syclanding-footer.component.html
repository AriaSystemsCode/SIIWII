<footer class="flex-rw p-4 d-none d-md-block footerBG">
    <div class="row">
        <ng-container *ngFor="let s of sectionsFlat; trackBy: trackBySection">
          <ng-container [ngSwitch]="s.type">
      
            <div *ngSwitchCase="'PF'" class="col-12 col-md-4 mb-4">
              
              <app-page-link-footer
                [sectionId]="s.sectionId"
                [sectionData]="s.inputs" >
              </app-page-link-footer>
            </div>
      
          </ng-container>
        </ng-container>
      </div>
      
    <section class="footer-bottom-section flex-rw">
        <div class="footer-bottom-wrapper">
            <div class="pb-4"><a href='#'>
                    <img src="../../../assets/landingPage/Logo_Main.png" />
                </a></div>

            <i class="fa fa-copyright" role="copyright">

            </i>
            <span class="footer-bottom-rights"> 2022 SIWII Security Your Privacy Terms</span>
        </div>
        <div class="footer-bottom-wrapper pt-5">
            <ng-container *ngFor="let s of sectionsFlat; trackBy: trackBySection">
                <div class="col-12 mb-4">
                    <ng-container [ngSwitch]="s.type">
                        <app-social-media-footer *ngSwitchCase="'SM'"
                        [sectionId]="s.sectionId"
                        [sectionData]="s.inputs"></app-social-media-footer>
                        </ng-container>
                    </div>
                    </ng-container>
                </div>
    </section>

</footer>


<footer class="flex-rw p-4 d-block d-md-none mb-5">
    <div class="footer-bottom-wrapper pt-5 d-flex socialMedia">
      <ng-container *ngFor="let s of sectionsFlat; trackBy: trackBySection">
        <div class="col-12 mb-4">
            <ng-container [ngSwitch]="s.type">
                <app-social-media-footer *ngSwitchCase="'SM'"
                [sectionId]="s.sectionId"
                [sectionData]="s.inputs"></app-social-media-footer>
                </ng-container>
            </div>
            </ng-container>
    </div>
</footer>
