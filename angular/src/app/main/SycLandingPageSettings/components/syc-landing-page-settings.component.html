<div class="contacts d-flex flex-column" style="margin-top: 40px;">
  <ng-container *ngFor="let s of sectionsFlat; ">
    <ng-container [ngSwitch]="s.type">

      <!-- auto slider with call to action-->
      <div *ngSwitchCase="'ASSB'">
        <h4>slider>> {{ s.inputs?.name  }}</h4>
        <app-slider 
        class="d-md-block d-none"
     
        [sectionId]="s.sectionId"
    >
</app-slider>
      </div>
 

         <!-- carusal slider multi blocks-->
      <app-cta *ngSwitchCase="'CSMP'"   [sectionId]="s.sectionId"
               [sectionData]="s.inputs">
      </app-cta>

         <!-- auto slider without call to action-->
       <div *ngSwitchCase="'ASMB'">
        <h4>slider without>> {{ s.inputs?.name  }}</h4>

        <app-syclanding-adv 
        class=" d-block"    [sectionId]="s.sectionId"
       >
</app-syclanding-adv>
       </div>



      <!--single row Call to Action  (can be brands or products)-->
      <div *ngSwitchCase="'SRCTA'" class="bg-white rounded p-4 m-2 mb-4 ml-4 mr-4" style="margin:30px 50px !important;">
        <h4 class="text-center">{{ s.inputs?.title  }}</h4>
        <p-carousel [value]="brands" [numVisible]="8" [numScroll]="8" [circular]="false" [showIndicators]="false"
        [showNavigators]="true" class="p-4 m-2  rounded">
  
        <ng-template pTemplate="item" let-brand>
          <div class="px-2 my-2 d-flex flex-column">

            <img [src]="brand?.image ? attachmentBaseUrl + '/' +  brand?.image : '../../../../assets/placeholders/_logo-placeholder.png'" class="mb-2" style="width: 80px;" alt="" srcset=""
              onerror="'../../../../assets/placeholders/_logo-placeholder.png'" (click)="goToBrand(brand)">
              <a (click)="goToBrand(brand)">{{brand?.label}}</a>
          </div>
        </ng-template>
      </p-carousel>
      </div>

    <!--single row Call to Action  (can be brands or products)-->

      <!--multi row Call to Action  (can be brands or products)-->
      <div *ngSwitchCase="'productsPaged'" class="bg-white rounded p-4 m-2 mb-4 ml-4 mr-4" style="margin:30px 50px !important;">
        <h4>{{ s.inputs?.title  }}</h4>
        <p-carousel [value]="pages" [numVisible]="1" [numScroll]="1" [circular]="false" [showIndicators]="false" [showNavigators]="true" class="p-4 m-2 rounded">
          <ng-template pTemplate="item" let-page>
            <div class="products-grid">
              <div *ngFor="let product of page" class="px-2 my-2">
                <app-prodcut-card [product]="product.appItem" [productCard]="product"></app-prodcut-card>
              </div>
            </div>
          </ng-template>
        </p-carousel>
      </div>
