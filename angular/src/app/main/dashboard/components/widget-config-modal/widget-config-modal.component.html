<!-- widget-config-modal.component.html -->
<div bsModal #dlg="bs-modal" class="modal fade" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">

      <div class="modal-header align-items-center">
        <h5 class="modal-title">
          New {{ chartType | titlecase }} Widget
        </h5>
        <button type="button" class="btn-close ms-2" aria-label="Close" (click)="hide()"></button>
      </div>

      <div class="modal-body" [formGroup]="form">
        <div class="row">
          <div class="col-5">

            <!-- Entity -->
            <div>
              <label class="form-label">Entity</label>
              <p-dropdown
                [options]="entities"
                formControlName="entity"
                placeholder="Select entity"
                (onChange)="onEntityChange()">
              </p-dropdown>
            </div>

            <!-- ========================= -->
            <!-- CALCULATION WIDGET FIELDS -->
            <!-- ========================= -->
            <ng-container *ngIf="chartType === 'calculation'">
              <div class="mt-3">
                <label class="form-label">Aggregation</label>
                <p-dropdown
                  [options]="calcAggOptions"
                  optionLabel="label"
                  optionValue="value"
                  formControlName="calcAgg"
                  placeholder="Select aggregation"
                  (onChange)="onCalcAggChange()">
                </p-dropdown>
              </div>

              <!-- Only show Field when agg requires it -->
              <div class="mt-2" *ngIf="requiresCalcField(form.value.calcAgg)">
                <label class="form-label">Field</label>
                <p-dropdown
                  [options]="measures"
                  optionLabel="label"
                  optionValue="name"
                  formControlName="calcField"
                  placeholder="Select field">
                </p-dropdown>
              </div>

              <div class="mt-2">
                <label class="form-label">Label (optional)</label>
                <input class="form-control" type="text" formControlName="calcLabel" placeholder="e.g. Total Sales" />
              </div>

              <div class="mt-2">
                <label class="form-label">Format (optional)</label>
                <p-dropdown
                  [options]="calcFormatOptions"
                  optionLabel="label"
                  optionValue="value"
                  formControlName="calcFormat"
                  placeholder="Select format">
                </p-dropdown>
              </div>
            </ng-container>

            <!-- ========================= -->
            <!-- BAR WIDGET FIELDS -->
            <!-- ========================= -->
            <ng-container *ngIf="chartType === 'bar'">
              <div class="mt-3">
                <h6 class="mb-2">Bar options</h6>

                <label class="form-label">X axis (Category)</label>
                <p-dropdown
                  [options]="dimensions"
                  optionLabel="label"
                  optionValue="name"
                  formControlName="barX"
                  placeholder="Select X axis"
                  (onChange)="onBarXChange()">
                </p-dropdown>

                <label class="form-label mt-2">Y series </label>
                <p-dropdown
                  [options]="measures"
                  optionLabel="label"
                  optionValue="name"
                  formControlName="barY"
                  defaultLabel="Select measures">
                </p-dropdown>
              </div>
            </ng-container>

            <!-- ========================= -->
            <!-- NORMAL CHART FIELDS -->
            <!-- ========================= -->
            <ng-container *ngIf="chartType === 'line'">

              <!-- X-axis -->
              <div class="mt-3">
                <label class="form-label">X-axis</label>
            
                <div class="mb-2">
                  <small class="text-muted d-block">Measure</small>
                  <p-dropdown
                    [options]="timeFields"
                    optionLabel="label"
                    optionValue="name"
                    formControlName="lineTimeField"
                    placeholder="Select date field">
                  </p-dropdown>
                </div>
            
                <div class="mb-2">
                  <small class="text-muted d-block">Time range</small>
                  <p-dropdown
                    [options]="timePresetOptions"
                    optionLabel="label"
                    optionValue="value"
                    formControlName="timePreset"
                    placeholder="Select range">
                  </p-dropdown>
                </div>
            
                <div class="mb-2">
                  <small class="text-muted d-block">Group by</small>
                  <p-dropdown
                    [options]="bucketOptions"
                    optionLabel="label"
                    optionValue="value"
                    formControlName="bucket"
                    placeholder="Select bucket">
                  </p-dropdown>
                </div>
            
                <!-- Custom range -->
                <div *ngIf="form.value.timePreset === 'custom'" class="d-flex gap-2">
                  <div class="flex-grow-1">
                    <small class="text-muted d-block">From</small>
                    <p-calendar formControlName="dateFrom" ></p-calendar>
                  </div>
                  <div class="flex-grow-1">
                    <small class="text-muted d-block">To</small>
                    <p-calendar formControlName="dateTo"></p-calendar>
                  </div>
                </div>
              </div>
            
              <!-- Y-axis -->
              <div class="mt-3">
                <label class="form-label">Y-axis</label>
            
                <div class="mb-2">
                  <small class="text-muted d-block">Measure</small>
                  <p-dropdown
                    [options]="calcAggOptions"
                    optionLabel="label"
                    optionValue="value"
                    formControlName="lineAgg"
                    (onChange)="onLineAggChange()"
                    placeholder="Count / Sum / Avg">
                  </p-dropdown>
                </div>
            
                <div class="mb-2" *ngIf="form.value.lineAgg !== 'count'">
                  <small class="text-muted d-block">Field</small>
                  <p-dropdown
                    [options]="measures"
                    optionLabel="label"
                    optionValue="name"
                    formControlName="lineField"
                    placeholder="Select numeric field">
                  </p-dropdown>
                </div>
            
                <div class="mb-2">
                  <small class="text-muted d-block">Group by (Series)</small>
                  <p-dropdown
                    [options]="dimensions"
                    optionLabel="label"
                    optionValue="name"
                    formControlName="lineSeriesField"
                    placeholder="Optional (e.g. Status)">
                  </p-dropdown>
                </div>
            
                <!-- <div class="d-flex align-items-center gap-2">
                  <p-inputSwitch formControlName="smooth"></p-inputSwitch>
                  <span class="text-muted">Smooth line</span>
                </div>
            
                <div class="d-flex align-items-center gap-2 mt-2">
                  <p-inputSwitch formControlName="stackedArea"></p-inputSwitch>
                  <span class="text-muted">Display as stacked area</span>
                </div>
            
                <div class="d-flex align-items-center gap-2 mt-2">
                  <p-inputSwitch formControlName="showLegend"></p-inputSwitch>
                  <span class="text-muted">Show legend</span>
                </div> -->
              </div>
            
            </ng-container>
            <ng-container *ngIf="chartType !== 'bar' && chartType !== 'calculation' && chartType !== 'line'">
              <div class="mt-3">
                <label class="form-label">Measure</label>
                <p-dropdown
                  [options]="measures"
                  optionLabel="label"
                  optionValue="name"
                  formControlName="measure"
                  placeholder="Select measure">
                </p-dropdown>
              </div>

              <div class="mt-2">
                <label class="form-label">Grouping</label>
                <p-dropdown
                  [options]="dimensions"
                  optionLabel="label"
                  optionValue="name"
                  formControlName="dimension"
                  placeholder="Dimension"
                  (onChange)="onDimensionChange()">
                </p-dropdown>

                <div *ngIf="form.value.dimension" class="mt-2">
                  <label class="form-label">by</label>
                  <p-multiSelect
                    [options]="dimensionValueOptions"
                    formControlName="dimensionValues"
                    defaultLabel="Select categories"
                    [display]="'chip'">
                  </p-multiSelect>
                </div>
              </div>
            </ng-container>

            <!-- Filters -->
            <div class="mt-3">
              <app-filter-builder
                [fields]="fields"
                [filterDefs]="filterDefs"
                (changed)="onFiltersChanged($event)">
              </app-filter-builder>
            </div>

          </div>

          <!-- Right side: NO preview -->
          <div class="col-7">
          
      
              <div class="preview-box">
                <app-chart-widget-card
                  [previewMode]="true"
                  [chartType]="chartType"
                  [externalData]="previewChartData"
                  [calcValue]="previewCalcValue"
                  [config]="previewConfig">
                </app-chart-widget-card>
         
            </div>
          
            <small class="text-muted d-block mt-2">
              Preview updates automatically based on your selections.
            </small>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" (click)="hide()">Cancel</button>
        <button class="btn btn-success" [disabled]="!canCreate()" (click)="submit()">Create</button>
      </div>

    </div>
  </div>
</div>
