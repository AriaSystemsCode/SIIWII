<div bsModal #dlg="bs-modal" class="modal fade" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
  
        <div class="modal-header align-items-center">
          <h5 class="modal-title">Create dashboard</h5>
          <button type="button" class="close" (click)="hide()" >
            <span aria-hidden="true">&times;</span>
        </button>
        
        </div>
  
        <div class="modal-body" [formGroup]="form">
          <!-- Name -->
          <div class="mb-3">
            <label class="form-label">Dashboard name</label>
            <input
              type="text"
              class="form-control"
              formControlName="name"
              placeholder="e.g. Sales Performance"
            />
            <small class="text-danger" *ngIf="form.get('name')?.touched && form.get('name')?.invalid">
              Name is required (min 3 chars)
            </small>
          </div>
  
          <!-- Optional description -->
          <!-- <div class="mb-3">
            <label class="form-label">Description (optional)</label>
            <textarea
              rows="3"
              class="form-control"
              formControlName="description"
              placeholder="Short description..."
            ></textarea>
          </div>
  
         -->
  
          <small class="text-muted d-block mt-2">
            You can add widgets after creating the dashboard.
          </small>
        </div>
  
        <div class="modal-footer">
          <button class="btn btn-light" type="button" (click)="hide()" [disabled]="saving">{{'Cancel' | localize}}</button>
          <button class="btn create-btn" type="button" (click)="submit()" [disabled]="form.invalid || saving">
         
            <i class="pi pi-spin pi-spinner mr-1" *ngIf="saving"></i>
            {{'Save' | localize}}
          </button>
        </div>
  
      </div>
    </div>
  </div>
