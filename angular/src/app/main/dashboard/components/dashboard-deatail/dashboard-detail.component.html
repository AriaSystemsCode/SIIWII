<p-toast></p-toast>

<div class="dashboard-detail-page container-fluid px-0">

    <!-- ============================================= -->
    <!-- DASHBOARD HEADER -->
    <!-- ============================================= -->

    <div class="dash-topbar shadow-sm">

        <div class="d-flex align-items-center justify-content-between">

            <div class="d-flex align-items-center gap-3 min-w-0">

                <div class="dash-icon">
                    <i class="pi pi-chart-bar"></i>
                </div>

                <div class="min-w-0">

                    <h2
                        class="dash-title text-truncate m-0"
                        [title]="dashboard.title">

                        {{ dashboard.title }}

                    </h2>

                    <div class="dash-meta text-muted mt-1">

                        <span class="mr-3">
                            Updated:
                            <b>
                                {{
                                    dashboard.updatedAt
                                        | date:'dd/MM/yyyy, HH:mm'
                                }}
                            </b>
                        </span>

                        <span *ngIf="sourceSpreadsheetId">
                            Spreadsheet:
                            <b>
                                #{{ sourceSpreadsheetId }}
                            </b>
                        </span>

                    </div>

                </div>

            </div>


            <!-- Actions -->
            <div class="d-flex align-items-center gap-2">

                <button
                    pButton
                    type="button"
                    icon="pi pi-refresh"
                    class="refreshBtn"
                    pTooltip="Refresh dashboard"
                    [loading]="refreshing"
                    [disabled]="
                        loading ||
                        !dashboardWorkbookReady
                    "
                    (click)="refreshDashboard()">
                </button>


                <p-menu
                    #menu
                    [popup]="true"
                    [model]="actionsMenuItems">
                </p-menu>


                <button
                    pButton
                    type="button"
                    icon="pi pi-ellipsis-h"
                    class="p-button-rounded p-button-text"
                    (click)="menu.toggle($event)"
                    aria-label="More actions">
                </button>

            </div>

        </div>

    </div>


    <!-- ============================================= -->
    <!-- DASHBOARD VIEW -->
    <!-- ============================================= -->

    <div class="dashboard-view-container">


        <!-- ========================================= -->
        <!-- LOADING -->
        <!-- ========================================= -->

        <div
            *ngIf="loading"
            class="dashboard-state">

            <i class="pi pi-spin pi-spinner"></i>

            <span>
                Loading dashboard...
            </span>

        </div>


        <!-- ========================================= -->
        <!-- ERROR -->
        <!-- ========================================= -->

        <div
            *ngIf="
                !loading &&
                dashboardLoadError
            "
            class="dashboard-state dashboard-error">

            <i class="pi pi-exclamation-triangle"></i>

            <span>
                {{ dashboardLoadError }}
            </span>

        </div>


        <!-- ========================================= -->
        <!-- DASHBOARD SPREADSHEET VIEWER -->
        <!-- ========================================= -->

        <div
            *ngIf="
                !loading &&
                !dashboardLoadError &&
                dashboardWorkbookReady
            "
            class="dashboard-sheet-viewer">


            <!--
                IMPORTANT:

                dashboardSheets contains the ORIGINAL
                workbook sheet objects.

                We DO NOT:
                - recreate charts
                - call openFromJson()
                - modify Dashboard rows/cells/charts
                - remove source sheets

                Dashboard is selected using
                dashboardActiveSheetIndex.

                Source sheets stay internally available
                because Dashboard charts may reference them.
            -->

            <ejs-spreadsheet

                #dashboardSpreadsheet

                width="100%"
                height="100%"

                [sheets]="dashboardSheets"

                [activeSheetIndex]="
                    dashboardActiveSheetIndex
                "

                [allowChart]="true"

                [allowEditing]="false"
                [allowInsert]="false"
                [allowDelete]="false"

                [allowSorting]="false"
                [allowFiltering]="false"

                [allowOpen]="false"
                [allowSave]="false"

                [enableContextMenu]="false"

                [enableKeyboardShortcut]="false"

                [showRibbon]="false"

                [showFormulaBar]="false"

                [showSheetTabs]="false">

            </ejs-spreadsheet>

        </div>

    </div>

</div>
