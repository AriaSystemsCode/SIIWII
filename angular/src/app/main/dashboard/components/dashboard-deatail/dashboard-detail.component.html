<p-toast></p-toast>

<div class="dashboard-detail-page container-fluid px-0">

    <!-- ============================================= -->
    <!-- DASHBOARD HEADER -->
    <!-- ============================================= -->

    <div class="dash-topbar shadow-sm">

        <div class="d-flex align-items-center justify-content-between">

            <div class="d-flex align-items-center gap-3 min-w-0">

                <div class="dash-icon">
                    <i class="pi pi-chart-bar"></i>
                </div>

                <div class="min-w-0">

                    <h2
                        class="dash-title text-truncate m-0"
                        [title]="dashboard.title">

                        {{ dashboard.title }}

                    </h2>

                    <div class="dash-meta text-muted mt-1">

                        <span class="mr-3">
                            Updated:
                            <b>
                                {{
                                    dashboard.updatedAt
                                        | date:'dd/MM/yyyy, HH:mm'
                                }}
                            </b>
                        </span>

                        <span *ngIf="sourceSpreadsheetId">
                            Spreadsheet:
                            <b>
                                #{{ sourceSpreadsheetId }}
                            </b>
                        </span>

                    </div>

                </div>

            </div>


            <!-- Actions -->
            <div class="d-flex align-items-center gap-2">

                <button
                    pButton
                    type="button"
                    icon="pi pi-refresh"
                    class="refreshBtn"
                    pTooltip="Refresh dashboard"
                    [loading]="refreshing"
                    [disabled]="
                        loading ||
                        !dashboardWorkbookReady
                    "
                    (click)="refreshDashboard()">
                </button>


                <p-menu
                    #menu
                    [popup]="true"
                    [model]="actionsMenuItems">
                </p-menu>


                <button
                    pButton
                    type="button"
                    icon="pi pi-ellipsis-h"
                    class="p-button-rounded p-button-text"
                    (click)="menu.toggle($event)"
                    aria-label="More actions">
                </button>

            </div>

        </div>

    </div>


    <!-- ============================================= -->
    <!-- DASHBOARD VIEW -->
    <!-- ============================================= -->

    <div class="dashboard-view-container">


        <!-- ========================================= -->
        <!-- LOADING -->
        <!-- ========================================= -->

        <div
            *ngIf="loading"
            class="dashboard-state">

            <i class="pi pi-spin pi-spinner"></i>

            <span>
                Loading dashboard...
            </span>

        </div>


        <!-- ========================================= -->
        <!-- ERROR -->
        <!-- ========================================= -->

        <div
            *ngIf="
                !loading &&
                dashboardLoadError
            "
            class="dashboard-state dashboard-error">

            <i class="pi pi-exclamation-triangle"></i>

            <span>
                {{ dashboardLoadError }}
            </span>

        </div>


        <!-- ========================================= -->
        <!-- DASHBOARD SPREADSHEET VIEWER -->
        <!-- ========================================= -->

        <div
            *ngIf="
                !loading &&
                !dashboardLoadError &&
                dashboardWorkbookReady
            "
            class="dashboard-sheet-viewer">

            <ejs-spreadsheet

                #dashboardSpreadsheet

                width="100%"
                height="100%"

                [sheets]="dashboardSheets"

                [activeSheetIndex]="
                    dashboardActiveSheetIndex
                "

                [allowChart]="true"

                [allowEditing]="false"
                [allowInsert]="false"
                [allowDelete]="false"

                [allowSorting]="false"
                [allowFiltering]="false"

                [allowOpen]="false"
                [allowSave]="false"

                [enableContextMenu]="false"

                [enableKeyboardShortcut]="false"

                [showRibbon]="false"

                [showFormulaBar]="false"

                [showSheetTabs]="false"

                (created)="onDashboardCreated()">

            </ejs-spreadsheet>

            <!--
                One Angular refresh button per saved Dashboard widget.
                Buttons are positioned over the native Syncfusion chart by TS,
                using the chart's saved top/left/width.
            -->
            <ng-container *ngFor="let widget of dashboardWidgets; trackBy: trackDashboardWidget">

                <button
                    *ngIf="widgetPosition(widget) as position"
                    type="button"
                    class="dashboard-widget-refresh-btn"
                    [style.left.px]="position.left"
                    [style.top.px]="position.top"
                    [disabled]="
                        refreshing ||
                        refreshingWidgetId === widget.id
                    "
                    [title]="
                        'Refresh ' +
                        (widget.chartTitle || 'chart') +
                        ' from ' +
                        widget.sourceSheetName
                    "
                    (click)="refreshDashboardWidget(widget, $event)">

                    <i
                        class="pi"
                        [ngClass]="
                            refreshingWidgetId === widget.id
                                ? 'pi-spin pi-spinner'
                                : 'pi-refresh'
                        ">
                    </i>

                </button>

            </ng-container>

        </div>

    </div>

</div>
