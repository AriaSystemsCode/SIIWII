<p-toast></p-toast>

<div class="dashboard-detail-page  px-0">

    <!-- ================= HEADER ================= -->
    <div class="dash-topbar">
        <div class="dashboard-topbar-content">

            <div class="dashboard-header-info">
                <span class="dash-icon"><i class="pi pi-chart-bar"></i></span>
                <div class="dash-meta">
                    <i class="pi pi-clock"></i>
                    <span>
                        {{ 'LastUpdated' | localize }}:
                        <b>{{ dashboard?.lastViewDate | momentFormat:'L' }}</b>
                    </span>
                </div>
            </div>

            <h2 class="dash-title text-truncate" [title]="dashboard?.title">
                {{ dashboard?.title }}
            </h2>

            <div class="dashboard-actions">
                <button pButton type="button" icon="pi pi-refresh" [label]="'Refresh' | localize"
                    class="p-button-outlined dashboard-refresh-btn" [pTooltip]="'RefreshDashboard' | localize"
                    tooltipPosition="bottom" [loading]="refreshing"
                    [disabled]="loading || refreshing || exportingPdf || !dashboardWorkbookReady"
                    (click)="refreshDashboard()">
                </button>

                <button pButton type="button" icon="pi pi-file-pdf" [label]="'ExportToPDF' | localize"
                    class="dashboard-export-btn" [loading]="exportingPdf"
                    [disabled]="loading || refreshing || exportingPdf || !dashboardWorkbookReady"
                    (click)="exportDashboardPdf()">
                </button>
            </div>

        </div>
    </div>

    <!-- ================= VIEW ================= -->
    <div class="dashboard-page-body">
        <div class="dashboard-view-container">

            <!-- Loading -->
            <!-- <div *ngIf="loading" class="dashboard-state">
                <div class="state-card">
                    <i class="pi pi-spin pi-spinner"></i>
                    <h4>{{ 'LoadingDashboard' | localize }}</h4>
                    <p>{{ 'PleaseWaitFewSeconds' | localize }}</p>
                </div>
            </div> -->

            <!-- Error -->
            <div *ngIf="!loading && dashboardLoadError" class="dashboard-state dashboard-error">
                <!-- <div class="state-card">
                    <i class="pi pi-exclamation-triangle"></i>
                    <h4>{{ 'DashboardLoadFailed' | localize }}</h4>
                    <p>{{ dashboardLoadError }}</p>
                </div> -->
            </div>

            <!-- Dashboard sheet (other sheets are hidden, charts still read them) -->
            <div *ngIf="!loading && !dashboardLoadError && dashboardWorkbookReady" #dashboardExportArea
                class="dashboard-sheet-viewer" [class.has-charts]="dashboardHasCharts">

                <ejs-spreadsheet #dashboardSpreadsheet width="100%" height="100%" [sheets]="dashboardSheets"
                    [activeSheetIndex]="dashboardActiveSheetIndex" [allowChart]="true" [allowEditing]="false"
                    [allowInsert]="false" [allowDelete]="false" [allowSorting]="false" [allowFiltering]="false"
                    [allowOpen]="false" [allowSave]="false" [enableContextMenu]="false" [enableKeyboardShortcut]="false"
                    [showRibbon]="false" [showFormulaBar]="false" [showSheetTabs]="false"
                    (click)="onDashboardChartClick($event)" (created)="onDashboardCreated()">
                </ejs-spreadsheet>
            </div>

            <!-- Busy overlay (outside the export area, so it never appears in the PDF) -->
            <div *ngIf="refreshing || exportingPdf" class="dashboard-busy-overlay">
                <div class="busy-pill">
                    <i class="pi pi-spin pi-spinner"></i>
                    <span>{{ (exportingPdf ? 'PreparingPdf' : 'RefreshingDashboard') | localize }}</span>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- ================= DRILLDOWN (shared) ================= -->
<app-drilldown-dialog [(visible)]="drilldownVisible" [title]="drilldownTitle" [records]="drilldownRecords">
</app-drilldown-dialog>
