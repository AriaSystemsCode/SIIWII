<div class="message-panel">
  <div class="message-tabs">
    <button
      type="button"
      [class.active]="messageTab === 'direct'"
      (click)="messageTab = 'direct'">
      {{ 'DirectMessage' | localize }}
    </button>

    <button
      type="button"
      [class.active]="messageTab === 'threads'"
      (click)="messageTab = 'threads'">
      {{ 'Threads' | localize }}
    </button>

    <button
      type="button"
      [class.active]="messageTab === 'mentions'"
      (click)="messageTab = 'mentions'">
      {{ 'Mentions' | localize }}
    </button>
  </div>
