<div class="products-grid px-md-1 px-3">
  <div *ngFor="let block of sliderItems" class="product-col">
    <div class="block-card" [style.aspect-ratio]="acceptedAspectRatio">
      <ng-container [ngSwitch]="block?.blockType?.toUpperCase()">


        <div *ngSwitchCase="'PRODUCT'" class="product-card-horizontal">
          <app-marketplace-product-card [item]="block" [attachmentBaseUrl]="attachmentBaseUrl"
          [languageSettingName]="languageSettingName" (view)="viewProduct($event)"
          (imgError)="onImgErr($event)"></app-marketplace-product-card>
        </div>

        <img *ngSwitchCase="'BRAND'" class="card-media only-media"
          [src]="block?.image ?  attachmentBaseUrl + '/' + block?.image: attachmentBaseUrl + '/' + block?.getAppEntityForViewDto?.appEntity?.entityAttachments[0]?.url "
          title="Brand {{block?.getAppEntityForViewDto?.appEntity?.name}}" alt="Brand" (click)="goToBrand(block)"
          (error)="onImgErr($event)" />


        <!-- CATEGORY -->
        <img *ngSwitchCase="'CATEGORY'" class="card-media" [src]="block?.image
          ? attachmentBaseUrl + '/' + block?.image
          : '../../../../assets/placeholders/_logo-placeholder.png'" alt="category" (click)="goToCategory(block)"
          (error)="onImgErr($event)" />
        <!-- ATTACHMENT -->
        <ng-container *ngSwitchCase="'ATTACHMENT'">
          <!-- Prefer an image attachment if available -->
          <img *ngIf="getAttachmentImage(block) as imgSrc" class="card-media only-media" [src]="imgSrc"
            [alt]="block?.name || 'Attachment'" (click)="onAttachmentClick(block)" (error)="onImgErr($event)" />

          <!-- If no image but there is a PDF, show PDF icon -->
          <img *ngIf="!getAttachmentImage(block) && hasPdfAttachment(block)" class="card-media only-media pdf-icon"
            src="assets/Items/pdf-Icon.png" alt="PDF" (click)="onAttachmentClick(block)" />

          <!-- Fallback: generic link if neither image nor pdf is detected -->
          <a *ngIf="!getAttachmentImage(block) && !hasPdfAttachment(block)" class="card-media only-media other-file"
            [href]="getAttachmentClickUrl(block)" target="_blank" rel="noopener">
            Open file
          </a>
        </ng-container>


        <!-- EVENT -->
        <div *ngSwitchCase="'EVENT'">
          <app-marketplace-event-card [block]="block?.getAppEventForViewDto?.appEvent"></app-marketplace-event-card>
        </div>

        <!-- ACCOUNT -->
        <div *ngSwitchCase="'CONTACT'">
          <app-marketplace-account-card [account]="block?.getAccountForViewDto" [compact]="true"
            [showConnectButton]="true"></app-marketplace-account-card>
        </div>
             
      </ng-container>
    </div>
  </div>
</div>
