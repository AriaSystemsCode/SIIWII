    <div class="products-grid">
      <div *ngFor="let block of sliderItems" class="  product-col">
     
        <app-prodcut-card *ngIf="block?.blockType?.toUpperCase() =='PRODUCT'"
          [product]="block?.getAppMarketItemForViewDto?.appItem"
          [productCard]="block?.getAppMarketItemForViewDto">
        </app-prodcut-card>

        <div class="px-2  d-flex flex-column sectionGeneral" *ngIf="block?.blockType?.toUpperCase()=='BRAND'">

          <img [src]="block?.image ? attachmentBaseUrl + '/' +  block?.image : '../../../../assets/placeholders/_logo-placeholder.png'" class="img-fluid"alt="" srcset=""
            onerror="'../../../../assets/placeholders/_logo-placeholder.png'" (click)="goToBrand(block)">
            <!-- <a (click)="goToBrand(block)">{{block?.name}}</a> -->
        </div>
        <!-- <div class="px-2  d-flex flex-column sectionGeneral" *ngIf="block?.blockType?.toUpperCase()=='CATEGORY'">

          <img [src]="block?.image ? attachmentBaseUrl + '/' +  block?.image : '../../../../assets/placeholders/_logo-placeholder.png'" class="mb-2"  alt="" srcset=""
            onerror="'../../../../assets/placeholders/_logo-placeholder.png'" (click)="goToCategory(block)">
            <a (click)="goToCategory(block)">{{block  ?.name}}</a>
        </div> -->

        <div *ngIf="block?.blockType?.toUpperCase()=='ATTACHMENT'" class="col sectionGeneral p-0  text-center">
          <ng-container [ngSwitch]="kindOfPath(block?.image)">
            <!-- image -->
            <img *ngSwitchCase="'image'"
                 [src]="fullUrl(block?.image)"
                 (click)="openTab(block?.link)"
                 class="img-fluid rounded border"
                 alt="{{ block?.name || 'attachment' }}"
                 (error)="onImgErr($event)">
    
            <!-- video -->
            <video *ngSwitchCase="'video'" class="w-100 rounded border" controls playsinline>
              <source [src]="fullUrl(block?.image)" />
              Your browser does not support the video tag.
            </video>
    
            <!-- pdf -->
            <div *ngSwitchCase="'pdf'" class="position-relative">
              <!-- <img [src]="block?.image ? attachmentBaseUrl + '/' +  block?.image : 'assets/placeholders/_logo-placeholder.png'" class="mb-2"  alt="" srcset=""
              onerror="'assets/placeholders/_logo-placeholder.png'"    (click)="openNewTab(block?.image)"> -->
              <img src="assets/Items/pdf-Icon.png" class=" iframSty" alt="" srcset=""    (click)="openNewTab(block?.image)">
              <!-- <iframe class=" iframSty"
          
                      [src]="attachmentSafeMap[block.id]"
                      (load)="block._pdfLoadErr=false"
                      (error)="block._pdfLoadErr=true">
              </iframe>
    
           
              <div *ngIf="block._pdfLoadErr" class="p-2 small text-muted">
                Can't display PDF here. <a [href]="fullUrl(block?.image)" target="_blank" rel="noopener">Open in new tab</a>
              </div>
    
              <button type="button"
                      class="btn btn-sm  position-absolute "
                      style="top: .5rem; left: .5rem"
                      (click)="openNewTab(block?.image)">
                      <i class="fa fa-download"></i>
              </button> -->
            </div>
    
            <!-- other file -->
            <a *ngSwitchDefault [href]="fullUrl(block?.image)" target="_blank" rel="noopener">
              Open file
            </a>
          </ng-container>
        </div>
      </div>

    </div>
  <!-- </ng-template> -->
