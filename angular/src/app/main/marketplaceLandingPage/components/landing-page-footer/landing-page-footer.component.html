<footer class="flex-rw p-4 d-none d-md-block " [style.backgroundColor]="bgCol">
  <div class="row">
    <ng-container *ngFor="let s of sectionsFlat; trackBy: trackBySection">
      <ng-container [ngSwitch]="s.type">

        <div *ngSwitchCase="'PF'" class="col-12 col-md-4 mb-4">
          <!-- <h4   [style.text-align]="
          s?.inputs?.titleAlignment === 'Center'
            ? 'center'
            : (s?.inputs?.titleAlignment === 'Right' ? 'right' : 'left')
        ">{{ s.inputs?.title }}</h4> -->
          <app-footer-page-link [sectionId]="s.sectionId" [sectionData]="s.inputs">
          </app-footer-page-link>
        </div>

      </ng-container>
    </ng-container>
  </div>

  <section class="footer-bottom-section flex-rw">
    <div class="footer-bottom-wrapper pt-5"  [ngClass]="isArabic ? 'ar-mg':'en-mg'">

      <div class="pb-4"><a href='#'>
          <img [src]=" attachmentBaseUrl + '/' +tenantLogo " style="width: 50px;" />
        </a></div>

      <!-- <i class="fa fa-copyright" role="copyright"></i> -->
      <i class="fa fa-copyright" role="copyright"></i>
      <span class="footer-bottom-rights"> 2026 {{tenantName}} Security Your Privacy Terms</span>
    </div>
    <div class="footer-bottom-wrapper pt-5">
      <ng-container *ngFor="let s of sectionsFlat; trackBy: trackBySection">
        <div class="col-12 mb-4">
          <ng-container [ngSwitch]="s.type">
            <app-footer-social-media *ngSwitchCase="'SM'" [sectionId]="s.sectionId"
              [sectionData]="s.inputs"></app-footer-social-media>
          </ng-container>
        </div>
      </ng-container>
    </div>
  </section>

</footer>


<footer class="flex-rw p-4 d-block d-md-none mb-5">
  <div class="footer-bottom-wrapper pt-5 d-flex socialMedia">
    <ng-container *ngFor="let s of sectionsFlat; trackBy: trackBySection">
      <div class="col-12 mb-4">
        <ng-container [ngSwitch]="s.type">
          <app-footer-page-link *ngSwitchCase="'SM'" [sectionId]="s.sectionId"
            [sectionData]="s.inputs"></app-footer-page-link>
        </ng-container>
      </div>
    </ng-container>
  </div>
</footer>
