
<div class="four-blocks-section"   *ngIf="!loading">

  <div class="section-header">
    <h4 [style.text-align]="textAlign">
      {{ title }}
    </h4>
  </div>



  <div class="four-blocks-grid"
       *ngIf="!loading && blocks.length">

    <div class="block-item"
         *ngFor="let item of blocks">

      <app-landing-page-block-card
        [item]="item"
        [compact]="true"
        [blockTypeIsSingleOrMixed]="blockTypeIsSingleOrMixed"
        [loginTenaneSsin]="loginTenaneSsin"
        (eventDetails)="openEventDetails($event)">
      </app-landing-page-block-card>

    </div>

  </div>

</div>

  <div
    *ngIf="loading"
    class="section-loading d-flex justify-content-center align-items-center">

    <div class="spinner-border purple-spinner" role="status">
      <span class="sr-only">
        {{ 'Loading' | localize }}
      </span>
    </div>

  </div>

<app-view-event
  #viewEventModal
  [hideViewEv]="false">
</app-view-event>
