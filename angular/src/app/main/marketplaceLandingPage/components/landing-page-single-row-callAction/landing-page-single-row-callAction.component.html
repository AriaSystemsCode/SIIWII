<p-carousel [value]="blocksSorted" [numVisible]="5" [numScroll]="5" [circular]="false" [showIndicators]="false" [showNavigators]="true" class="p-4 m-2 rounded">
    <ng-template pTemplate="item" let-item>
      <div class="px-2 my-2 row" *ngIf="item?.blockType?.toUpperCase() =='PRODUCT'">
      
        <app-prodcut-card [product]="item?.getAppMarketItemForViewDto?.appItem" [productCard]="item?.getAppMarketItemForViewDto" class=""></app-prodcut-card>
      </div>
      <div class=" d-flex flex-column sectionGeneral" *ngIf="item?.blockType?.toUpperCase()=='BRAND'">

        <img [src]="item?.image ? attachmentBaseUrl + '/' +  item?.image : '../../../../assets/placeholders/_logo-placeholder.png'" class="mb-2"  alt="" srcset=""
          onerror="'../../../../assets/placeholders/_logo-placeholder.png'" (click)="goToBrand(item)">
          <a (click)="goToBrand(item)">{{item?.name}}</a>
      </div>

      <div class="px-2  d-flex flex-column sectionGeneral" *ngIf="item?.blockType?.toUpperCase()=='CATEGORY'">

        <img [src]="item?.image ? attachmentBaseUrl + '/' +  item?.image : '../../../../assets/placeholders/_logo-placeholder.png'" class="mb-2"  alt="" srcset=""
          onerror="'../../../../assets/placeholders/_logo-placeholder.png'" (click)="goToCategory(item)">
          <a (click)="goToCategory(item)">{{item?.name}}</a>
      </div>

      <div *ngIf="item?.blockType?.toUpperCase()=='ATTACHMENT'" class="col">
        <ng-container [ngSwitch]="kindOfPath(item?.image)">
          <!-- image -->
          <img *ngSwitchCase="'image'"
               [src]="fullUrl(item?.image)"
               class="img-fluid rounded border"
               alt="{{ item?.name || 'attachment' }}"
               (error)="onImgErr($event)">
  
          <!-- video -->
          <video *ngSwitchCase="'video'" class="w-100 rounded border" controls playsinline>
            <source [src]="fullUrl(item?.image)" />
            Your browser does not support the video tag.
          </video>
  
          <!-- pdf -->
          <div *ngSwitchCase="'pdf'" class="position-relative">
            <iframe class=" iframSty"
        
                    [src]="attachmentSafeMap[item.id]"
                    (load)="item._pdfLoadErr=false"
                    (error)="item._pdfLoadErr=true">
            </iframe>
  
            <!-- Fallback if viewer can’t embed -->
            <div *ngIf="item._pdfLoadErr" class="p-2 small text-muted">
              Can't display PDF here. <a [href]="fullUrl(item?.image)" target="_blank" rel="noopener">Open in new tab</a>
            </div>
  
            <!-- Optional: your own download button -->
            <button type="button"
                    class="btn btn-sm btn-outline-secondary position-absolute"
                    style="top: .5rem; left: .5rem"
                    (click)="openNewTab(item?.image)">
              dn
            </button>
          </div>
  
          <!-- other file -->
          <a *ngSwitchDefault [href]="fullUrl(item?.image)" target="_blank" rel="noopener">
            Open file
          </a>
        </ng-container>
      </div>
  

      <!-- <div class="px-2 my-2 row" *ngIf="item?.blockType?.toUpperCase() =='CONTACT'">
     
        <app-account-card

     
    ></app-account-card>
      </div> -->
    </ng-template>
  </p-carousel>
