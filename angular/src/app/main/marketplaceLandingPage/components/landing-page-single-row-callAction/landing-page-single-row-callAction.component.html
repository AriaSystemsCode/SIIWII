<p-carousel [value]="blocksSorted" [numVisible]="numVisible" [numScroll]="1" [circular]="false" [showIndicators]="false"
  [showNavigators]="true" [responsiveOptions]="responsiveOptions" class="p-4 m-2 rounded">
  <ng-template pTemplate="item" let-item>

    <div class="carousel-card">
      <div class="carousel-card-body" [ngSwitch]="item?.blockType?.toUpperCase()">

        <!-- PRODUCT -->
        <div *ngSwitchCase="'PRODUCT'">
          <app-marketplace-product-card [item]="item" [attachmentBaseUrl]="attachmentBaseUrl"
            [languageSettingName]="languageSettingName" (view)="viewProduct($event)"
            (imgError)="onImgErr($event)"></app-marketplace-product-card>
        </div>

        <!-- BRAND -->

        <img *ngSwitchCase="'BRAND'" class="card-media" [src]="item?.image ?  attachmentBaseUrl + '/' + item?.image: attachmentBaseUrl + '/' + item?.getAppEntityForViewDto?.appEntity?.entityAttachments[0]?.url 
           " title="Brand {{item?.getAppEntityForViewDto?.appEntity?.name}}" alt="Brand" (click)="goToBrand(item)"
          (error)="onImgErr($event)" />


        <!-- CATEGORY -->
        <img *ngSwitchCase="'CATEGORY'" class="card-media" [src]="item?.image
            ? attachmentBaseUrl + '/' + item?.image
            : '../../../../assets/placeholders/_logo-placeholder.png'" alt="category" (click)="goToCategory(item)"
          (error)="onImgErr($event)" />
        <!-- ATTACHMENT -->
        <ng-container *ngSwitchCase="'ATTACHMENT'">
          <!-- Prefer an image attachment if available -->
          <img *ngIf="getAttachmentImage(item) as imgSrc" class="card-media" [src]="imgSrc"
            [alt]="item?.name || 'Attachment'" (click)="onAttachmentClick(item)" (error)="onImgErr($event)" />

          <!-- If no image but there is a PDF, show PDF icon -->
          <img *ngIf="!getAttachmentImage(item) && hasPdfAttachment(item)" class="card-media pdf-icon"
            src="assets/Items/pdf-Icon.png" alt="PDF" (click)="onAttachmentClick(item)" />

          <!-- Fallback: generic link if neither image nor pdf is detected -->
          <a *ngIf="!getAttachmentImage(item) && !hasPdfAttachment(item)" class="card-media other-file"
            [href]="getAttachmentClickUrl(item)" target="_blank" rel="noopener">
            Open file
          </a>
        </ng-container>


        <!-- EVENT -->
        <div *ngSwitchCase="'EVENT'">
          <app-marketplace-event-card [block]="item?.getAppEventForViewDto?.appEvent"></app-marketplace-event-card>
        </div>

        <!-- ACCOUNT -->
        <div *ngSwitchCase="'CONTACT'">
          <app-marketplace-account-card [account]="item?.getAccountForViewDto" [compact]="true"
            [showConnectButton]="true"></app-marketplace-account-card>
        </div>
      </div>
    </div>
  </ng-template>
</p-carousel>
