<p-carousel
  [value]="blocksSorted"
  [numVisible]="5"
  [numScroll]="5"
  [circular]="false"
  [showIndicators]="false"
  [showNavigators]="true"
  class="p-4 m-2 rounded">

  <ng-template pTemplate="item" let-item>
    <div class="carousel-card">
      <div class="carousel-card-body " [ngSwitch]="item?.blockType?.toUpperCase()" #itemCard>

        <!-- PRODUCT -->
        <app-prodcut-card
          *ngSwitchCase="'PRODUCT'"
          class="carousel-media"
          [acceptedAspectRatio]="acceptedAspectRatio"
          [product]="item?.getAppMarketItemForViewDto?.appItem"
          [productCard]="item?.getAppMarketItemForViewDto">
        </app-prodcut-card>

        <!-- BRAND -->
        <img
          *ngSwitchCase="'BRAND'"
          class="carousel-media"
          [src]="item?.image ? attachmentBaseUrl + '/' + item?.image : '../../../../assets/placeholders/_logo-placeholder.png'"
          alt=""
          (click)="goToBrand(item)"
          [ngStyle]="{ 'height.px': itemCard.clientWidth / acceptedAspectRatio }"
          (error)="onImgErr($event)" />


                  <!-- CATEGORY -->

          <!-- <div class="px-2  d-flex flex-column sectionGeneral" *ngIf="item?.blockType?.toUpperCase()=='CATEGORY'">

        <img [src]="item?.image ? attachmentBaseUrl + '/' +  item?.image : '../../../../assets/placeholders/_logo-placeholder.png'" class="mb-2"  alt="" srcset=""
          onerror="'../../../../assets/placeholders/_logo-placeholder.png'" (click)="goToCategory(item)">
          <a (click)="goToCategory(item)">{{item?.name}}</a>
      </div> -->

        <!-- ATTACHMENT -->
        <ng-container *ngSwitchCase="'ATTACHMENT'">
          <ng-container [ngSwitch]="kindOfPath(item?.image)">

            <!-- image -->
            <img
              *ngSwitchCase="'image'"
              class="carousel-media"
              [src]="fullUrl(item?.image)"
              alt="{{ item?.name || 'attachment' }}"
              (click)="openTab(item?.link)"
              (error)="onImgErr($event)" />

            <!-- video -->
            <video
              *ngSwitchCase="'video'"
              class="carousel-media"
              controls
              playsinline>
              <source [src]="fullUrl(item?.image)" />
              Your browser does not support the video tag.
            </video>

            <!-- pdf -->
            <img
              *ngSwitchCase="'pdf'"
              class="carousel-media pdf-icon"
              src="assets/Items/pdf-Icon.png"
              alt="PDF"
              (click)="openNewTab(item?.image)" />

            <!-- other file -->
            <a *ngSwitchDefault [href]="fullUrl(item?.image)" target="_blank" rel="noopener">
              Open file
            </a>
          </ng-container>
        </ng-container>

      </div>
    </div>
  </ng-template>
</p-carousel>
