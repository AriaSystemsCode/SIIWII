<div class="section-content position-relative">

  <!-- Loader -->
  <div
    *ngIf="loading"
    class="section-loading d-flex justify-content-center align-items-center">

    <div class="spinner-border purple-spinner" role="status">
      <span class="sr-only">
        {{ 'Loading' | localize }}
      </span>
    </div>

  </div>
<p-carousel *ngIf="!loading && blocksSorted.length > 0"
  [value]="blocksSorted"  
  [numVisible]="numVisible"
  [numScroll]="numScroll"
  [circular]="false"
  [autoplayInterval]="interval"
  class="sliderImages hiddenIndicator "
  [showIndicators]="false"
>
  <ng-template pTemplate="item" let-slide>
    <div class="pt-2" #ads>
      <div class="d-block">
        <app-image-display
          [image]="slide?.image ? (attachmentBaseUrl + '/' + slide.image) : '../../../../assets/placeholders/_logo-placeholder.png'"
          [sycAttachmentCategory]="sycAttachmentCategoryBanner"
          [staticWidth]="ads.offsetWidth"  >
        </app-image-display>
      </div>
    </div>
  </ng-template>
</p-carousel>



  <!-- Empty state -->
  <div
    *ngIf="!loading && !hasLoadError && blocksSorted.length === 0"
    class="section-empty text-center py-5">

    {{ 'NoDataFound' | localize }}

  </div>

  <!-- Error state -->
  <div
    *ngIf="!loading && hasLoadError"
    class="section-error text-center py-5">

    {{ 'FailedToLoadData' | localize }}

  </div>

</div>
