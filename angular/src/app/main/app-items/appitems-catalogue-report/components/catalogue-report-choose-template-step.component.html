<div style="gap: 20px;" class="d-flex flex-column justify-content-between wizard-wrapper">
    <div class="d-flex">
    <img src="../../../../../assets/common/images/alarm.png" class="mr-2"/> 
    <h5 *ngIf="templates && templates?.length >0" class="plzTxt mb-0 mt-2"> {{ "SelectLinesheetTemplate" | localize }}</h5>
</div>
    <div class="_scroll h-100 row thin-scroll text-center">
        <div class="col-lg-4 col-md-6 col-12" *ngFor="let template of templates;index as i">
            <app-catalogue-report-template-card [index]="i" [template]="template" [printInfoParam]="printInfoParam">
            </app-catalogue-report-template-card>
        </div>
    </div>
    <div class="d-flex flex-row justify-content-between  w-100">
        <button class="btn btnPrev" type="button" (click)="previousStep()">
            <i class="fa-arrow-left fas ml-3"></i>
            {{ "Previous" | localize }}
        </button>
        <button class="btn btnCont" (click)="continueToNextStep()">
            {{ "Continue" | localize }}
            <i class="fa-arrow-right fas ml-3"></i>
        </button>
    </div>
</div>
