<div [@routerTransition] [ngStyle]="{'margin-top': isModal ? '0!important':'-90px!important'}" class="pr-lg-4"
    style="padding-top: 40px;">
    <div>
        <div class="kt-subheader kt-grid__item"
            style="height: 80px !important;    border-bottom-right-radius: 12px !important;" *ngIf="!isModal">
            <div [class]="containerClass">
                <div class="kt-subheader__main">
                    <h3 class="kt-subheader__title">
                        <a class="text-capitalize text-dark" type="button" (click)="redirectToAppItemList()">
                            <i class="fas fa-arrow-left"></i>
                            {{ "Back" | localize }}
                        </a>
                    </h3>
                    <span class="
                            kt-subheader__separator kt-subheader__separator--v
                        "></span>
                    <span class="kt-subheader__desc">
                        {{ "Linesheet" | localize }}
                    </span>
                    <span class="mr-1" *ngIf="title"> > </span>
                    <span class="kt-subheader__desc" *ngIf="title">
                        <a class="text-capitalize text-black-50" (click)="redirectToAppItemList()">
                            {{ title | localize }}
                        </a>
                    </span>
                    <span class="mr-1"> > </span>
                    <span class="kt-subheader__desc"> {{"Print" | localize }} </span>
                </div>
            </div>
        </div>

        <div [class]="containerClass + ' kt-grid__item kt-grid__item--fluid'"  [ngClass]="{'addMrLg mt-md-0 mt-5 pt-lg-5 pt-0 pl-lg-5 pl-md-0':isArabic}">
            <div class="kt-portlet kt-portlet--mobile h-100 radius-12" [ngClass]="{ 'isModal': isModal }">
                <div class="kt-portlet__body d-flex flex-column h-100 "
                    [ngClass]="{ 'h-100' : currentStep != printCatalogueStepsEnum.ReportViewer,'pt-0 pb-0':isModal }">

                    <div class="row">
                        <div class="addBrdr w-100 d-flex justify-content-between pb-2">
                            <div class=" linshW">
                                <h3>{{"Linesheet" | localize }}</h3>
                            </div>
                      
                                <button type="button"  type="button" class="closBtn"
                                    [title]="'Close' | localize" (click)="askToConfirmCancel()"
                                  >
                                    <span>&times;</span>
                                </button>
                         
                        </div>
                        <div class="col-12 d-flex align-items-center mt-3">
                            <div  *ngFor="let step of steps; last as last; let i = index" [ngClass]="{
                                        'current-step':
                                            currentStep ==
                                            step.printCatalogueStepsEnum,
                                        'done-step':
                                            (currentStep >
                                            step.printCatalogueStepsEnum  && 
                                             i != 4 ) || (currentStep >4 && 
                                             i==4 )
                                          
                                    }">

                                <p class="stpTitle ml-md-5 ml-2" style="white-space: nowrap;"
                                    [ngClass]="currentStep >= step.printCatalogueStepsEnum ? 'currStp':'defStp'">{{
                                    step.title }}</p>
                                <div class="d-flex align-items-center">

                                    <span
                                        class="fake-circle  d-flex align-items-center justify-content-center position-relative"
                                        [ngClass]="{   'mt-lg-4 mt-4' : i ==4}">
                                        <i
                                            [ngClass]="currentStep == step.printCatalogueStepsEnum ? step.icon : (currentStep > step.printCatalogueStepsEnum ? 'step.icon' : '' )  "></i>
                                        <p *ngIf="i != 4"
                                            [ngClass]="currentStep >= step.printCatalogueStepsEnum ? 'currStp handlPos':'defStp defPos'" class="position-absolute text-white"
                                          
                            >{{ (i == 1 || i ==0) ? step.printCatalogueStepsEnum + 1 :
                                            step.printCatalogueStepsEnum }}</p>
                                        <svg *ngIf="i == 4"  [ngStyle]="isArabic ? {'left':'20%'} : {'right':'20%'}" class="svgW position-absolute"
                                            height="32" viewBox="0 0 32 32" fill="none"
                                            xmlns="http://www.w3.org/2000/svg">
                                            <path d="M6 17.6L11.7143 24L26 8" stroke="white" stroke-width="3"
                                                stroke-linecap="round" stroke-linejoin="round" />
                                        </svg>

                                    </span>
                                    <div *ngIf="currentStep == step.printCatalogueStepsEnum && i != 4">
                                        <svg class="addW" height="12" viewBox="0 0 124 12" fill="none"
                                            xmlns="http://www.w3.org/2000/svg">
                                            <rect x="0.5" width="123" height="12" rx="4" fill="#4A0D4A" />
                                        </svg>

                                        <span class="" *ngIf="!last">
                                            <svg class="addW" height="12" viewBox="0 0 233 12" fill="none"
                                                xmlns="http://www.w3.org/2000/svg">
                                                <rect x="0.5" width="232" height="12" rx="4" fill="#EEEEEE" />
                                            </svg>

                                        </span>
                                    </div>

                                    <div *ngIf="currentStep > step.printCatalogueStepsEnum && i != 4">

                                        <svg class="addFW" height="12" viewBox="0 0 232 12" fill="none"
                                            xmlns="http://www.w3.org/2000/svg">
                                            <rect width="232" height="12" rx="4" fill="#4A0D4A" />
                                        </svg>


                                    </div>

                                    <div *ngIf="currentStep < step.printCatalogueStepsEnum && i != 4">


                                        <span class="" *ngIf="!last">
                                            <svg class="addFW" height="12" viewBox="0 0 233 12" fill="none"
                                                xmlns="http://www.w3.org/2000/svg">
                                                <rect x="0.5" width="232" height="12" rx="4" fill="#EEEEEE" />
                                            </svg>

                                        </span>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                    <div class="d-flex flex-column flex-grow-1 pt-5 pb-1">
                        <ng-container *ngIf="active">
                            <div [ngClass]="{'d-block':currentStep == printCatalogueStepsEnum.DataSelection}"
                                class="h-100 d-none">
                                <app-catalogue-report-data-selection-step (continue)="dataSelectionDone()"
                                    [printInfoParam]="printInfoParam" [getAllAppItemsInput]="getAllAppItemsInput"
                                    [itemListId]="itemListId" class="h-75">
                                </app-catalogue-report-data-selection-step>
                            </div>
                        </ng-container>

                        <ng-container *ngIf="
                                    currentStep ==
                                    printCatalogueStepsEnum.ChooseTemplate
                                " class="h-100">
                            <app-catalogue-report-choose-template-step (continue)="chooseTemplateDone($event)"
                                (previous)="templatePrevious()" [printInfoParam]="printInfoParam"
                                [templates]="templates" class="h-100">
                            </app-catalogue-report-choose-template-step>
                        </ng-container>


                        <ng-container *ngIf="
                                    currentStep ==
                                    printCatalogueStepsEnum.DetailInfo
                                " class="h-100">
                            <app-catalogue-detail-info-step (continue)="DetailInfoDone()"
                                (previous)="DetailInfoPrevious()" (searchAccount)="searchAccounts($event)"
                                [printInfoParam]="printInfoParam" [accounts]="accounts" class="h-75">
                            </app-catalogue-detail-info-step>
                        </ng-container>


                        <ng-container *ngIf="active">
                            <div [ngClass]="{'d-block':currentStep == printCatalogueStepsEnum.PrintInfo}"
                                class="h-100 d-none">
                                <app-catalogue-report-products-print-info (continue)="printInfoDone()"
                                    (previous)="printInfoPrevious()" [printInfoParam]="printInfoParam" class="h-75">
                                </app-catalogue-report-products-print-info>
                            </div>
                        </ng-container>
                        <ng-container *ngIf="
                                currentStep == printCatalogueStepsEnum.ReportViewer;
                            ">
                            <div [ngClass]="{'visibility-hidden' : printInfoParam.EmailLinesheet}">
                                <report-viewer [reportUrl]="reportUrl" [invokeAction]="invokeAction"
                                    (documentReady)="reportDocumentReadyHandler($event)">
                                </report-viewer>
                            </div>
                        </ng-container>
                    </div>


                </div>
            </div>
        </div>
    </div>
</div>
