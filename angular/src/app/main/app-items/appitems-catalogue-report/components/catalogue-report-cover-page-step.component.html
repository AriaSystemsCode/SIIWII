<form #coverPageForm="ngForm" >
    <div class="d-flex flex-column h-100" >
        <div class="d-flex align-items-center">
            <img src="../../../../../assets/common/images/alarm.png" /> 
        <h5 class="col-12 ml-2 plzTxt pl-0">{{ "Please fill the required linesheet information" | localize }}</h5>

        </div>
        <div class="row">
            <div class="col-12 row">
                <div class="align-items-baseline mt-4 col-lg-6 col-md-10">
                    <label class="col-8 col-lg-6 " for="reportTitle">
                        <h6>
                            <span class="text-danger">*</span
                            > {{ "LinesheetName" | localize }}
                        </h6>
                    </label>
                    <div class="col-md-10 col-lg-12">
                        <input
                            type="text"
                            [required]="true"
                            name="reportTitle"
                            id="reportTitle"
                            [(ngModel)]="printInfoParam.reportTitle"
                            class="
                                form-control
                                bg-white
                                form-control-border-grey
                            "
                            [maxlength]="250"
                            #reportTitleInput="ngModel"
                            [ngClass]="{ 'border-danger': false }"
                            [placeholder]="'Enterlinesheetname' | localize"
                            (keyup)="onChangLinesheetName()"
                        />
                    </div>

                    <div class="col-8 col-lg-6 mt-2 ml-1">
                        <span class="text-muted">
                            250 {{ "digits" | localize }} <span style="color: #F6851D;" class="ml-2">* Mandatory</span>
                        </span>
                        <validation-messages
                            [formCtrl]="reportTitleInput"
                        >
                        </validation-messages>
                    </div>
                </div>
                <div class="align-items-baseline mt-4 col-lg-6 col-md-10">
                    <label class="col-8 col-lg-6 " for="account">
                        <h6>
                            {{ "PreparedForAccount" | localize }}
                        </h6>
                    </label>
                    <div class="col-md-10 col-lg-12">
                        <div class="wide-drop-down position-relative" >
                            <p-autoComplete
                                [styleClass]="'w-100'"
                                [inputStyleClass]="'w-100 form-control pl-3 bg-white'"
                                name="account"
                                [inputId]="'account'"
                                [suggestions]="accounts"
                                [placeholder]="'EnterAccountName' | localize"
                                (onKeyUp)="searchAccounts($event.target.value)"
                                (onSelect)="selectAccount($event)"
                                [(ngModel)]="selectedAccount"
                                [field]="'name'"
                                [dataKey]="'id'"
                                [forceSelection]="true"
                            >
                                <ng-template let-account pTemplate="selectedItem">
                                    <span >{{account.name}}</span>
                                </ng-template>
                            </p-autoComplete>
                            <img src="../../../../../assets/common/images/Icon2.png" class="frndImg" /> 
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- <div class="d-flex flex-row justify-content-between pr-5 w-100" >
            <button class="btn btn-primary" type="button" (click)="previousStep()">
                <i class="fa-arrow-left fas ml-3"></i>
                {{ "Previous" | localize }}
            </button>
            <button class="btn btn-primary" [disabled]="coverPageForm.invalid" (click)="continueToNextStep()">
                {{ "Continue" | localize }}
                <i class="fa-arrow-right fas ml-3"></i>
            </button>
        </div> -->
    </div>
</form>
