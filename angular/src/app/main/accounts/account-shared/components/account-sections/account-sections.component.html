<p-accordion *ngIf="account">

  <p-accordionTab header="Basic Information" [selected]="true">

    <div class="row">

      <div class="col-md-6 mb-3">
        <label>Trade Name:</label>
        <input
          class="form-control"
          [(ngModel)]="account.name"
          [readonly]="mode === 'view'" />
      </div>

      <div class="col-md-6 mb-3">
        <label>Email:</label>
        <input
          class="form-control"
          [(ngModel)]="account.eMailAddress"
          [readonly]="mode === 'view'" />
      </div>

      <div class="col-md-6 mb-3">
        <label>Currency:</label>
        <input
          class="form-control"
          [(ngModel)]="account.currencyCode"
          [readonly]="mode === 'view'" />
      </div>

      <div class="col-md-6 mb-3">
        <label>Phone:</label>
        <input
          class="form-control"
          [(ngModel)]="account.phone1Number"
          [readonly]="mode === 'view'" />
      </div>

      <div class="col-md-6 mb-3">
        <label>Account Type:</label>
        <input
          class="form-control"
          [(ngModel)]="account.accountType"
          [readonly]="mode === 'view'" />
      </div>

      <div class="col-md-6 mb-3">
        <label>SSIN:</label>
        <input
          class="form-control"
          [(ngModel)]="account.ssin"
          [readonly]="mode === 'view'" />
      </div>

    </div>

  </p-accordionTab>

  <p-accordionTab header="Business Information">
    <div class="row">

      <div class="col-md-6 mb-3">
        <label>Website:</label>
        <input class="form-control" [(ngModel)]="account.website" [readonly]="mode === 'view'" />
      </div>

      <div class="col-md-6 mb-3">
        <label>City:</label>
        <input class="form-control" [(ngModel)]="account.city" [readonly]="mode === 'view'" />
      </div>

      <div class="col-md-6 mb-3">
        <label>State:</label>
        <input class="form-control" [(ngModel)]="account.state" [readonly]="mode === 'view'" />
      </div>

      <div class="col-md-6 mb-3">
        <label>Zip Code:</label>
        <input class="form-control" [(ngModel)]="account.zipCode" [readonly]="mode === 'view'" />
      </div>

    </div>
  </p-accordionTab>

  <p-accordionTab header="Relationship">
    <p>Visibility: {{ entityData?.visibility || '-' }}</p>
    <p>Connection Count: {{ entityData?.connectionCount || 0 }}</p>
  </p-accordionTab>

</p-accordion>
