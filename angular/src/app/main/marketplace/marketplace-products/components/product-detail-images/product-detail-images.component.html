
<div class="wrapper" *ngIf="productImages?.length">

    <div
        class="d-flex align-items-start justify-content-center"
        style="gap: 10px;">

        <!-- THUMBNAILS: 7 OR FEWER -->
        <div
            *ngIf="productImages.length <= 7"
            class="slides d-flex align-items-lg-start justify-content-around flex-column">

            <div
                *ngFor="let a of productImages; let i = index"
                class="mb-1">

                <!-- IMAGE THUMB -->
                <img
                    *ngIf="kindOf(a) === 'image'"
                    class="imageSlides"
                    [src]="getUrl(a)"
                    alt="Thumbnail"
                    [ngClass]="i === currentIndex ? 'border border-primary' : ''"
                    (click)="setMainImage(i)"
                    onerror="this.src='../../../../../assets/placeholders/appitem-placeholder.png'"
                />

                <!-- VIDEO THUMB -->
                <video
                    *ngIf="kindOf(a) === 'video'"
                    class="imageSlides"
                    style="height:70px;"
                    muted
                    playsinline
                    preload="metadata"
                    [ngClass]="i === currentIndex ? 'border border-primary' : ''"
                    (click)="setMainImage(i)">

                    <source [src]="getUrl(a)" />

                </video>

                <!-- PDF THUMB -->
                <div
                    *ngIf="kindOf(a) === 'pdf'"
                    class="imageSlides d-flex align-items-center justify-content-center bg-light position-relative overflow-hidden"
                    style="height:70px;width:50px;cursor:pointer;"
                    [ngClass]="i === currentIndex ? 'border border-primary' : ''"
                    (click)="setMainImage(i)">

                    <!-- LOADING -->
                    <div
                        *ngIf="pdfThumbLoadingMap[i]"
                        class="w-100 h-100 d-flex align-items-center justify-content-center">

                        <i class="fa fa-spinner fa-spin"></i>

                    </div>

                    <!-- PDF PREVIEW -->
                    <img
                        *ngIf="!pdfThumbLoadingMap[i] && pdfThumbMap[i]"
                        [src]="pdfThumbMap[i]"
                        (error)="onPdfPreviewError(i)"
                        style="width:100%;height:100%;object-fit:cover;"
                    />

                    <!-- PDF ICON -->
                    <i
                        *ngIf="!pdfThumbLoadingMap[i] && !pdfThumbMap[i]"
                        class="fa fa-file-pdf-o fa-2x text-danger">
                    </i>

                </div>

                <!-- OTHER FILE -->
                <div
                    *ngIf="kindOf(a) === 'other'"
                    class="imageSlides d-flex align-items-center justify-content-center bg-light"
                    style="height:60px;width:60px;cursor:pointer;"
                    [ngClass]="i === currentIndex ? 'border border-primary' : ''"
                    (click)="setMainImage(i)">

                    <i class="fa fa-file-o"></i>

                </div>

            </div>

        </div>

        <!-- THUMBNAILS: MORE THAN 7 -->
        <div *ngIf="productImages.length > 7">

            <div class="slider-container">

                <div
                    class="slider"
                    [style.transform]="'translateY(' + translateY + 'px)'">

                    <ng-container
                        *ngFor="let a of productImages; let i = index">

                        <!-- IMAGE THUMB -->
                        <img
                            *ngIf="kindOf(a) === 'image'"
                            class="imageSlides mb-2"
                            [src]="getUrl(a)"
                            alt="Thumbnail"
                            [ngClass]="i === currentIndex ? 'border border-primary' : ''"
                            (click)="setMainImage(i)"
                            onerror="this.src='../../../../../assets/placeholders/appitem-placeholder.png'"
                        />

                        <!-- VIDEO THUMB -->
                        <video
                            *ngIf="kindOf(a) === 'video'"
                            class="imageSlides mb-2"
                            muted
                            playsinline
                            preload="metadata"
                            [ngClass]="i === currentIndex ? 'border border-primary' : ''"
                            (click)="setMainImage(i)">

                            <source [src]="getUrl(a)" />

                        </video>

                        <!-- PDF THUMB -->
                        <div
                            *ngIf="kindOf(a) === 'pdf'"
                            class="imageSlides mb-2 d-flex align-items-center justify-content-center bg-light position-relative overflow-hidden"
                            style="height:60px;width:60px;cursor:pointer;"
                            [ngClass]="i === currentIndex ? 'border border-primary' : ''"
                            (click)="setMainImage(i)">

                            <!-- LOADING -->
                            <div *ngIf="pdfThumbLoadingMap[i]">

                                <i class="fa fa-spinner fa-spin"></i>

                            </div>

                            <!-- PDF PREVIEW -->
                            <img
                                *ngIf="!pdfThumbLoadingMap[i] && pdfThumbMap[i]"
                                [src]="pdfThumbMap[i]"
                                (error)="onPdfPreviewError(i)"
                                style="width:100%;height:100%;object-fit:cover;"
                            />

                            <!-- PDF ICON -->
                            <i
                                *ngIf="!pdfThumbLoadingMap[i] && !pdfThumbMap[i]"
                                class="fa fa-file-pdf-o fa-2x text-danger">
                            </i>

                        </div>

                        <!-- OTHER FILE -->
                        <div
                            *ngIf="kindOf(a) === 'other'"
                            class="imageSlides mb-2 d-flex align-items-center justify-content-center bg-light"
                            style="height:60px;width:60px;cursor:pointer;"
                            [ngClass]="i === currentIndex ? 'border border-primary' : ''"
                            (click)="setMainImage(i)">

                            <i class="fa fa-file-o"></i>

                        </div>

                    </ng-container>

                </div>

            </div>

            <!-- NEXT THUMBNAIL -->
            <button
                type="button"
                class="indicator-btns"
                (click)="slideToNextImage()">

                <i class="fa fa-chevron-down"></i>

            </button>

        </div>

        <!-- MAIN VIEWER -->
        <div class="main-image">

            <!-- MAIN IMAGE -->
            <img
                *ngIf="kindOf(productImages[currentIndex]) === 'image' && !colorView"
                class="main"
                style="cursor:zoom-in;"
                [src]="getUrl(productImages[currentIndex])"
                (click)="openImagePreview(getUrl(productImages[currentIndex]))"
                onerror="this.src='../../../../../assets/placeholders/appitem-placeholder.png'"
            />

            <!-- MAIN COLOR IMAGE -->
            <img
                *ngIf="kindOf(productImages[currentIndex]) === 'image' && colorView"
                class="main"
                style="cursor:zoom-in;"
                [src]="attachmentBaseUrl + '/' + colorAttachmentForMainIamge"
                (click)="openImagePreview(attachmentBaseUrl + '/' + colorAttachmentForMainIamge)"
                onerror="this.src='../../../../../assets/placeholders/appitem-placeholder.png'"
            />

            <!-- MAIN VIDEO -->
            <video
                *ngIf="kindOf(productImages[currentIndex]) === 'video'"
                class="main"
                controls
                playsinline
                preload="metadata"
                style="min-height:40vh !important;">

                <source [src]="getUrl(productImages[currentIndex])" />

                Your browser does not support the video tag.

            </video>

            <!-- MAIN PDF -->
            <ng-container
                *ngIf="kindOf(productImages[currentIndex]) === 'pdf'">

                <!-- LOADING -->
                <div
                    *ngIf="pdfThumbLoadingMap[currentIndex]"
                    class="d-flex align-items-center justify-content-center"
                    style="min-width:200px;height:150px;">

                    <i class="fa fa-spinner fa-spin fa-2x text-primary"></i>

                    <span class="mx-3">
                        Loading preview...
                    </span>

                </div>

                <!-- UPLOADED OR GENERATED PDF PREVIEW -->
                <img
                    *ngIf="
                        !pdfThumbLoadingMap[currentIndex] &&
                        pdfThumbMap[currentIndex]
                    "
                    class="w-100 imageContainer main"
                    [src]="pdfThumbMap[currentIndex]"
                    style="cursor:pointer;object-fit:contain;"
                    (click)="openNewTab(productImages[currentIndex])"
                    (error)="onPdfPreviewError(currentIndex)"
                />

                <!-- PDF FALLBACK -->
                <div
                    *ngIf="
                        !pdfThumbLoadingMap[currentIndex] &&
                        !pdfThumbMap[currentIndex]
                    "
                    class="main d-flex flex-column align-items-center justify-content-center bg-light"
                    style="min-height:250px;cursor:pointer;"
                    (click)="openNewTab(productImages[currentIndex])">

                    <i class="fa fa-file-pdf-o fa-4x text-danger"></i>

                    <span class="mt-3">
                        Open PDF
                    </span>

                </div>

            </ng-container>

            <!-- OTHER FILE -->
            <div
                *ngIf="kindOf(productImages[currentIndex]) === 'other'"
                class="main d-flex flex-column align-items-center justify-content-center"
                style="min-height:250px;">

                <i class="fa fa-file-o fa-4x"></i>

                <button
                    type="button"
                    class="btn btn-link mt-3"
                    (click)="openNewTab(productImages[currentIndex])">

                    Open file

                </button>

            </div>

            <!-- IMAGE PREVIEW DIALOG -->
            <p-dialog
                [(visible)]="showImagePreview"
                [modal]="true"
                [closable]="true"
                [dismissableMask]="true"
                [draggable]="false"
                [resizable]="false"
                [style]="{width:'70vw',maxWidth:'900px'}"
                [contentStyle]="{padding:'0'}">

                <div
                    class="d-flex align-items-center justify-content-center p-3">

                    <img
                        [src]="previewImageUrl"
                        style="max-width:100%;max-height:70vh;object-fit:contain;"
                        onerror="this.src='../../../../../assets/placeholders/appitem-placeholder.png'"
                    />

                </div>

            </p-dialog>

        </div>

    </div>

</div>
