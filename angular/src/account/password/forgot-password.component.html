<div class="kt-login__form Login_container" style="max-width: 70%;" [@routerTransition]>
    <div class="kt-login__title m-0">
        <h3 class="text-left m-0 mb-2 ForgotPassword font-weight-bold">
            {{ 'ForgotPassword' | localize }}
        </h3>
    </div>

    <form class="kt-form m-0" #forgotPassForm="ngForm" method="post" novalidate (ngSubmit)="save()">
        <p  class="text-left alarmInfo_title">
            <img src="../../assets/img/input_icons/alarm.png" class="alarmInfo mr-2">    {{"SendPasswordResetLink_Information" | localize}}
        </p>

        <div class="form-group MT40 mb-5 pb-5">
            <label class="sub_titleLog m-0 p-0 font-weight-bold"> User Name <span class="StarInfo" style="color: #F6851D;">*</span></label>
            <div class="user_p_relative">
            <img src="../../assets/img/input_icons/user.png" class="user_icon icon-width">
            <input #UserNameInput="ngModel" [(ngModel)]="model.userName" autoFocus class="MT0 form-control placeholder-no-fix" type="text" autocomplete="new-password" placeholder="{{'UserName@DomainName' | localize}}" name="UserName" required maxlength="256"  />
            </div>
            <validation-messages [formCtrl]="UserNameInput"></validation-messages> 
        </div>
        <div class="kt-login__actions pt-5 mt-5">
            <button [disabled]="saving"  routerLink="/account/login" type="button" class="backBtn btn btn-light btn-elevate kt-login__btn-secondary pl-5 pr-5">{{"Back" | localize}}</button>
            <!-- <i class="fa fa-arrow-left"></i>  -->
            <button type="submit"   
             class="submitBtn btn  btn-elevate kt-login__btn-primary pl-5 pr-5" [disabled]="!forgotPassForm.form.valid" [buttonBusy]="saving" [busyText]="l('SavingWithThreeDot')"> {{"Submit" | localize}}</button>
             <!-- <i class="fa fa-check"></i> -->
        </div>
    </form>
</div>
