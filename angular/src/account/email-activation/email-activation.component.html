<div class="kt-login__form Login_container" [@routerTransition]>
    <div class="kt-login__title">
        <h3 class="text-left EmailActivation m-0 mb-2 font-weight-bold">
            {{"EmailActivation" | localize}}
        </h3>

        <form class="kt-form text-left m-0" #emailActivationForm="ngForm" method="post" novalidate (ngSubmit)="save()">
            <p class="text-left alarmInfo_title">
                <img src="../../assets/img/input_icons/alarm.png" class="alarmInfo mr-2">
                {{"SendEmailActivationLink_Information" | localize}}
            </p>
            <div class="form-group text-left  mb-5 pb-5">
                <label class="sub_titleLog">{{' EmailAddress' | localize}} <span class="StarInfo" style="color: #F6851D;">*</span></label>
                <div class="user_p_relative">
                    <img src="../../assets/img/input_icons/mail-02.png" class="user_icon icon-width">
                    <input #emailAddressInput="ngModel" [(ngModel)]="model.emailAddress"
                        class="MT0 form-control form-control-solid placeholder-no-fix input-ltr" type="email"
                        autocomplete="new-password" placeholder="{{'Enter Your Email Address' | localize}} *" name="emailAddress"
                        required maxlength="256" email />
                </div>
                <validation-messages [formCtrl]="emailAddressInput"></validation-messages>
            </div>
            <div class="kt-login__actions  pt-5 mt-5">
                <button [disabled]="saving" routerLink="/account/login" type="button"
                    class="backBtn btn btn-light btn-elevate kt-login__btn-secondary  pl-5 pr-5"> {{"Back" | localize}}</button>
                <!-- <i class="fa fa-arrow-left"></i> -->
                <button type="submit" class="submitBtn btn btn-elevate kt-login__btn-primary  pl-5 pr-5"
                    [disabled]="!emailActivationForm.form.valid" [buttonBusy]="saving"
                    [busyText]="l('SavingWithThreeDot')"> {{"Submit" | localize}}</button>
                <!-- <i class="fa fa-check"></i> -->
            </div>
        </form>
    </div>
</div>
